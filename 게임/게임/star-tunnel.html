<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hyper Dive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#03020a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// ================== 기본 셋업 ==================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, vignette = null, baseF = 400, F = 400, CX = 0, CY = 0;
const FONT = '"Orbitron","Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
const KFONT = '"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif';
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[(Math.random() * arr.length) | 0];
const outBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const outCubic = t => 1 - Math.pow(1 - t, 3);

// 3D 상수: z = 카메라로부터의 깊이
const ZP = 110, ZFAR = 2600, SEG = 70, TR = 130, FLOOR = 78, NT = 10;
let XMAX = 72, YMAX = 48;
// 색수차 후처리용 오프스크린 버퍼
const abA = document.createElement('canvas'), abB = document.createElement('canvas');
const abAc = abA.getContext('2d'), abBc = abB.getContext('2d');

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = (W * DPR) | 0; cv.height = (H * DPR) | 0;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  abA.width = abB.width = cv.width; abA.height = abB.height = cv.height;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  CX = W / 2; CY = H * 0.5;
  baseF = Math.min(W * 1.15, H * 1.05); F = baseF;
  YMAX = clamp(48 * H / W, 40, 80);
  vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.7)');
}

// ================== 사운드 (WebAudio 합성) ==================
let AC = null, master = null, noiseBuf = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f1, f2, dur, type = 'square', vol = 0.1, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 1000) {
  if (!AC || muted) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
let lastHitSfx = 0, lastBoomSfx = 0, lastClank = 0;
const SFX = {
  shoot: () => tone(1500, 600, 0.05, 'square', 0.013),
  hit: () => { if (T - lastHitSfx < 0.04) return; lastHitSfx = T; tone(320, 140, 0.05, 'sawtooth', 0.03); },
  clank: () => { if (T - lastClank < 0.06) return; lastClank = T; tone(1300, 900, 0.04, 'square', 0.018); },
  shield: () => { if (T - lastClank < 0.06) return; lastClank = T; tone(2400, 1700, 0.06, 'sine', 0.035); },
  boom: () => { if (T - lastBoomSfx < 0.03) return; lastBoomSfx = T; noise(0.5, 0.3, 1800); tone(170, 40, 0.35, 'sine', 0.22); },
  big: () => { noise(1.6, 0.5, 2600); tone(120, 22, 1.4, 'sine', 0.45); },
  power: () => { tone(500, 1500, 0.2, 'triangle', 0.12); tone(800, 2200, 0.2, 'triangle', 0.1, 0.08); },
  hurt: () => { noise(0.35, 0.45, 900); tone(220, 50, 0.35, 'sawtooth', 0.16); },
  warn: () => { for (let i = 0; i < 3; i++) { tone(520, 520, 0.22, 'square', 0.07, i * 0.5); tone(390, 390, 0.22, 'square', 0.07, i * 0.5 + 0.25); } },
  start: () => { tone(300, 900, 0.3, 'sawtooth', 0.08); tone(600, 1800, 0.35, 'triangle', 0.08, 0.1); },
  lock: () => { tone(1600, 1600, 0.035, 'square', 0.03); tone(2200, 2200, 0.04, 'square', 0.03, 0.045); },
  missile: () => { noise(0.45, 0.18, 3500); tone(260, 900, 0.3, 'sawtooth', 0.04); },
  gate: () => { tone(880, 1320, 0.12, 'triangle', 0.08); tone(1320, 1760, 0.14, 'triangle', 0.06, 0.07); },
  perfect: () => { [0, 4, 7, 12].forEach((n, i) => { const f = 660 * Math.pow(2, n / 12); tone(f, f * 1.01, 0.14, 'triangle', 0.07, i * 0.05); }); },
  boost: () => { noise(1.2, 0.22, 5000); tone(150, 900, 0.9, 'sawtooth', 0.04); },
  charge: () => tone(180, 900, 1.2, 'sawtooth', 0.05),
};

// ================== 글로우 스프라이트 캐시 ==================
const glowCache = {};
let GA = 1; // 현재 엔티티의 안개 알파
function glowSprite(color) {
  if (glowCache[color]) return glowCache[color];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.22, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return (glowCache[color] = c);
}
function drawGlow(x, y, r, color, a = 1) {
  if (r <= 0.3 || a <= 0.01) return;
  ctx.globalAlpha = Math.min(1, a) * GA;
  ctx.drawImage(glowSprite(color), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = GA;
}
function polyM(pts) { // 좌우 대칭 (중앙 연결) 다각형
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  for (let i = pts.length - 1; i >= 0; i--) ctx.lineTo(-pts[i][0], pts[i][1]);
  ctx.closePath();
}
function polyS(pts) { // 좌우 대칭 (분리된) 두 다각형
  ctx.beginPath();
  for (const s of [1, -1]) { ctx.moveTo(pts[0][0] * s, pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0] * s, pts[i][1]); ctx.closePath(); }
}
const hueGlow = h => `hsl(${(((h % 360) + 360) % 360 / 15 | 0) * 15},100%,62%)`;

// ================== 3D 투영 / 월드 ==================
let segs = [], segId = 0, envMode = 'tunnel', stars = [], dust = [], hue = 190, hueTarget = 190;
let camX = 0, camY = 0, camRoll = 0, bendX = 0, bendY = 0;
let PX = 0, PY = 0, PS = 0;
function proj(x, y, z) {
  const zz = z < 3 ? 3 : z, s = F / zz, b = zz * zz * 0.0001;
  PX = CX + (x + bendX * b - camX) * s; PY = CY + (y + bendY * b - camY) * s; PS = s;
}
const fog = z => clamp((ZFAR - z) / 800, 0, 1);
const ENV = { tunnel: ['NEON TUNNEL', '네온 터널'], canyon: ['CRYSTAL CANYON', '크리스탈 협곡'], grid: ['OPEN VOID', '오픈 보이드 공역'] };
function newSeg(z) {
  segId++;
  return { z, id: segId, mode: envMode, hue: hueTarget, rot: segId * 0.04, jl: rand(0, 30), jr: rand(0, 30), hl: rand(-170, -60), hr: rand(-170, -60), sc: 1, px: new Float32Array(10), py: new Float32Array(10) };
}
function newStar(z, inner) { const a = rand(0, TAU), r = inner ? rand(25, 115) : rand(170, 1200); return { x: Math.cos(a) * r, y: Math.sin(a) * r, z }; }
function initWorld() {
  segs = []; for (let z = 30; z < ZFAR + SEG; z += SEG) segs.push(newSeg(z));
  stars = []; for (let i = 0; i < 200; i++) stars.push(newStar(rand(10, ZFAR), false));
  dust = []; for (let i = 0; i < 45; i++) dust.push(newStar(rand(10, ZFAR), true));
}
function updateWorld(dt) {
  const d = spd * dt;
  for (const s of segs) s.z -= d;
  while (segs.length > 2 && segs[0].z < 8) segs.shift();
  while (segs[segs.length - 1].z < ZFAR) segs.push(newSeg(segs[segs.length - 1].z + SEG));
  for (const s of stars) { s.z -= d; if (s.z < 5) { const n = newStar(ZFAR + rand(0, 200), false); s.x = n.x; s.y = n.y; s.z = n.z; } }
  for (const s of dust) { s.z -= d; if (s.z < 5) { const n = newStar(ZFAR + rand(0, 200), true); s.x = n.x; s.y = n.y; s.z = n.z; } }
}
function drawSky() {
  proj(0, 0, ZFAR);
  const vx = PX, vy = PY, R = Math.max(W, H) * 0.9;
  const g = ctx.createRadialGradient(vx, vy, 0, vx, vy, R);
  g.addColorStop(0, `hsla(${hue},90%,60%,0.5)`); g.addColorStop(0.12, `hsla(${hue + 25},85%,35%,0.28)`);
  g.addColorStop(0.5, `hsla(${hue + 60},80%,15%,0.12)`); g.addColorStop(1, `hsla(${hue + 60},80%,8%,0)`);
  ctx.fillStyle = g; ctx.fillRect(-W, -H, W * 3, H * 3);
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(vx, vy, Math.min(W, H) * 0.16, '#ffffff', 0.55);
  drawGlow(vx + Math.sin(T * 0.1) * W * 0.3, vy - H * 0.2, Math.min(W, H) * 0.5, hueGlow(hue + 70), 0.12);
  ctx.globalCompositeOperation = 'source-over';
}
function drawStarList(list, am) {
  const len = 15 + spd * 0.045 * (1 + boostK * 5);
  ctx.globalCompositeOperation = 'lighter';
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    for (const s of list) {
      if ((s.z < 900) !== (pass === 0)) continue;
      proj(s.x, s.y, s.z); const x1 = PX, y1 = PY;
      if (x1 < -100 || x1 > W + 100 || y1 < -100 || y1 > H + 100) continue;
      proj(s.x, s.y, s.z + len); ctx.moveTo(x1, y1); ctx.lineTo(PX, PY);
    }
    ctx.strokeStyle = pass === 0 ? `rgba(220,240,255,${0.85 * am})` : `rgba(180,210,255,${0.35 * am})`;
    ctx.lineWidth = pass === 0 ? 1.6 : 1; ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawEnv() {
  for (const s of segs) {
    if (s.mode === 'tunnel') {
      for (let k = 0; k < NT; k++) { const a = s.rot + k / NT * TAU; proj(Math.cos(a) * TR, Math.sin(a) * TR, s.z); s.px[k] = PX; s.py[k] = PY; }
    } else if (s.mode === 'canyon') {
      const xl = -TR - s.jl, xr = TR + s.jr;
      proj(xl, FLOOR, s.z); s.px[0] = PX; s.py[0] = PY;
      proj(xl - 25, s.hl, s.z); s.px[1] = PX; s.py[1] = PY;
      proj(xr, FLOOR, s.z); s.px[2] = PX; s.py[2] = PY;
      proj(xr + 25, s.hr, s.z); s.px[3] = PX; s.py[3] = PY;
      for (let k = 0; k < 3; k++) { proj(-TR + (k + 1) * TR / 2, FLOOR, s.z); s.px[4 + k] = PX; s.py[4 + k] = PY; }
    } else {
      for (let k = 0; k < 9; k++) { proj(-400 + k * 100, FLOOR + 20, s.z); s.px[k] = PX; s.py[k] = PY; }
    }
    s.sc = PS;
  }
  for (let i = segs.length - 1; i >= 1; i--) {
    const b = segs[i], a = segs[i - 1];
    const al = fog(b.z) * clamp(a.z / 50, 0, 1);
    if (al <= 0.01 || a.mode !== b.mode) continue;
    const h = a.hue;
    if (a.mode === 'tunnel') {
      for (let par = 0; par < 2; par++) {
        ctx.beginPath();
        for (let k = par; k < NT; k += 2) {
          const k2 = (k + 1) % NT;
          ctx.moveTo(a.px[k], a.py[k]); ctx.lineTo(a.px[k2], a.py[k2]); ctx.lineTo(b.px[k2], b.py[k2]); ctx.lineTo(b.px[k], b.py[k]); ctx.closePath();
        }
        const L = (a.id % 2 ? 8 : 12) + par * 3;
        ctx.fillStyle = `hsla(${h},60%,${L}%,${al * 0.88})`; ctx.fill();
      }
      ctx.strokeStyle = `hsla(${h},100%,65%,${al * 0.5})`; ctx.lineWidth = 1;
      ctx.beginPath(); for (let k = 0; k < NT; k++) { ctx.moveTo(a.px[k], a.py[k]); ctx.lineTo(b.px[k], b.py[k]); } ctx.stroke();
      const lit = a.id % 4 === 0;
      ctx.strokeStyle = lit ? `hsla(${h + 20},100%,75%,${al})` : `hsla(${h},100%,60%,${al * 0.55})`;
      ctx.lineWidth = Math.min(14, Math.max(1, (lit ? 2.4 : 0.8) * a.sc));
      ctx.beginPath(); ctx.moveTo(a.px[0], a.py[0]); for (let k = 1; k < NT; k++) ctx.lineTo(a.px[k], a.py[k]); ctx.closePath(); ctx.stroke();
      if (lit) {
        ctx.globalCompositeOperation = 'lighter';
        const gc = hueGlow(h + 20);
        for (let k = 0; k < NT; k++) drawGlow(a.px[k], a.py[k], Math.min(120, 9 * a.sc), gc, al * 0.7);
        ctx.globalCompositeOperation = 'source-over';
      }
    } else if (a.mode === 'canyon') {
      const q4 = (i0, i1, i2, i3) => { ctx.beginPath(); ctx.moveTo(a.px[i0], a.py[i0]); ctx.lineTo(a.px[i1], a.py[i1]); ctx.lineTo(b.px[i1], b.py[i1]); ctx.lineTo(b.px[i0], b.py[i0]); ctx.closePath(); };
      q4(0, 2); ctx.fillStyle = `hsla(${h},40%,7%,${al})`; ctx.fill();
      const L = a.id % 2 ? 10 : 14;
      q4(0, 1); ctx.fillStyle = `hsla(${h + 10},40%,${L}%,${al})`; ctx.fill();
      q4(2, 3); ctx.fillStyle = `hsla(${h + 10},40%,${L + 2}%,${al})`; ctx.fill();
      ctx.strokeStyle = `hsla(${h},100%,62%,${al * 0.6})`; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(a.px[0], a.py[0]); ctx.lineTo(a.px[2], a.py[2]);
      for (let k = 4; k < 7; k++) { ctx.moveTo(a.px[k], a.py[k]); ctx.lineTo(b.px[k], b.py[k]); }
      ctx.moveTo(a.px[0], a.py[0]); ctx.lineTo(b.px[0], b.py[0]); ctx.moveTo(a.px[2], a.py[2]); ctx.lineTo(b.px[2], b.py[2]);
      ctx.stroke();
      ctx.strokeStyle = `hsla(${h + 30},100%,75%,${al * 0.9})`; ctx.lineWidth = Math.min(6, Math.max(1, 0.6 * a.sc));
      ctx.beginPath(); ctx.moveTo(a.px[1], a.py[1]); ctx.lineTo(b.px[1], b.py[1]); ctx.moveTo(a.px[3], a.py[3]); ctx.lineTo(b.px[3], b.py[3]); ctx.stroke();
    } else {
      ctx.strokeStyle = `hsla(${h},100%,62%,${al * 0.65})`; ctx.lineWidth = Math.min(4, Math.max(1, 0.4 * a.sc));
      ctx.beginPath();
      for (let k = 0; k < 9; k++) { ctx.moveTo(a.px[k], a.py[k]); ctx.lineTo(b.px[k], b.py[k]); }
      ctx.moveTo(a.px[0], a.py[0]); ctx.lineTo(a.px[8], a.py[8]);
      ctx.stroke();
      if (a.id % 3 === 0) {
        ctx.globalCompositeOperation = 'lighter';
        const gc = hueGlow(h);
        for (let k = 0; k < 9; k += 2) drawGlow(a.px[k], a.py[k], Math.min(60, 5 * a.sc), gc, al * 0.6);
        ctx.globalCompositeOperation = 'source-over';
      }
    }
  }
}

// ================== 게임 상태 ==================
let state = 'title', T = 0, titleT = 0, overT = 0, paused = false;
let timeScale = 1, slowmo = 0, hitstop = 0, shake = 0, flash = 0, flashColor = '#fff', aberr = 0, hurtT = 0;
let player, lasers, missiles, ebullets, enemies, obstacles, parts, rings, texts, pickups, spawnQueue, cracks, locks;
let score = 0, shownScore = 0, scoreBump = 0, combo = 0, comboT = 0, maxCombo = 0;
let stage = 0, stageTime = 0, clearT = -1, banner = null, boss = null, bossDeath = null, aimTarget = null;
let spd = 650, boostT = 0, boostK = 0, fovKick = 0, gateChain = 0, btnPress = 0;
let best = 0, newRecord = false, lastInput = 'key', hpShake = 0;
let isTouch = false;
try { isTouch = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches); } catch (e) { isTouch = false; }
try { best = +localStorage.getItem('hyperDiveBest') || 0; } catch (e) { best = 0; }
const THEMES = [190, 300, 25, 140, 260, 340, 60, 210];
const PCOL = { W: '#ffcc33', S: '#33ffaa', M: '#ff6a3d' };

function resetGame() {
  player = { x: 0, y: 10, vx: 0, vy: 0, tx: 0, ty: 10, bank: 0, pitch: 0, hp: 5, maxHp: 5, wpn: 1, cap: 3, inv: 2.5, fireT: 0.6, reload: 0, alive: true, shot: 0 };
  lasers = []; missiles = []; ebullets = []; enemies = []; obstacles = []; parts = []; rings = []; texts = []; pickups = []; spawnQueue = []; cracks = []; locks = [];
  score = 0; shownScore = 0; combo = 0; comboT = 0; maxCombo = 0; stage = 0; stageTime = 0; clearT = -1;
  banner = null; boss = null; bossDeath = null; aimTarget = null;
  boostT = 0; gateChain = 0; newRecord = false; slowmo = 0; timeScale = 1; hurtT = 0; aberr = 0;
}
function startGame() {
  initAudio(); SFX.start();
  resetGame(); state = 'play'; paused = false; flash = 0.6; flashColor = '#bfe8ff'; aberr = 0.6;
  nextStage();
}
function boost(dur) { boostT = Math.max(boostT, dur); fovKick = 1; aberr = Math.max(aberr, 0.35); SFX.boost(); }

// ================== 스테이지 ==================
function q(t, f) { spawnQueue.push({ t, f }); }
const yr = () => Math.max(20, YMAX - 18);
const GROUPS = {
  vee() { const cx = rand(-40, 40), cy = rand(-30, 20); for (let i = 0; i < 5; i++) { const o = i - 2; q(Math.abs(o) * 0.12, () => spawnE('dart', cx + o * 14, cy + Math.abs(o) * 6, ZFAR, { amp: 4, freq: 2, ph: i })); } return 1; },
  line() { const cx = rand(-30, 30), cy = rand(-25, 15), amp = rand(20, 35); for (let i = 0; i < 6; i++) q(i * 0.22, () => spawnE('dart', cx, cy, ZFAR, { amp, freq: 2.2, ph: 0 })); return 1.6; },
  circle() { const cx = rand(-25, 25), cy = rand(-20, 15); for (let k = 0; k < 8; k++) q(0, () => spawnE('dart', cx, cy, ZFAR, { circ: true, cx, cy, rad: 30, ang: k / 8 * TAU, w: 1.6 })); return 1.2; },
  saucers() { for (let k = 0; k < 2; k++) q(k * 0.8, () => spawnE('saucer', rand(-50, 50), rand(-35, 10), ZFAR, { hold: rand(800, 1100), tx: rand(-45, 45) })); return 3; },
  raiders() { for (let k = 0; k < 3; k++) { const s = k % 2 ? 1 : -1; q(k * 0.5, () => spawnE('raider', s * 150, -70, 15, { hold: rand(800, 1000), tx: rand(-45, 45), ty: rand(-30, 20) })); } return 3; },
  mines() { for (let k = 0; k < 4; k++) q(k * 0.35, () => spawnE('mine', rand(-55, 55), rand(-40, 35), ZFAR)); return 2; },

  if (best > 0) { ctx.font = `700 13px ${FONT}`; ctx.fillStyle = 'rgba(255,225,77,0.8)'; ctx.fillText('BEST ' + best, W / 2, H * 0.81); }
  ctx.font = `600 ${Math.min(13, W / 28)}px ${KFONT}`; ctx.fillStyle = 'rgba(255,255,255,0.6)';
  if (isTouch) {
    fitText('드래그로 이동 · 레이저 자동 발사', W / 2, H * 0.87, W - 32);
    fitText('조준선을 적에 겹쳐 록온 → MISSILE 버튼으로 유도 미사일', W / 2, H * 0.91, W - 32);
  } else {
    fitText('이동: 마우스 · WASD / 방향키   |   레이저 자동 발사', W / 2, H * 0.87, W - 32);
    fitText('조준선을 적에 겹쳐 최대 6기 록온 → SPACE / 우클릭으로 유도 미사일   |   P 일시정지 · M 소리', W / 2, H * 0.91, W - 32);
  }
}
function drawOver() {
  const t = overT;
  ctx.fillStyle = `rgba(5,3,15,${Math.min(0.7, t * 0.8)})`; ctx.fillRect(0, 0, W, H);
  const txt = 'GAME OVER', fs = Math.min(72, W / 8);
  ctx.font = `900 ${fs}px ${FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const tw = ctx.measureText(txt).width; let x = W / 2 - tw / 2; const cy = H * 0.34;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i], w = ctx.measureText(ch).width, k = clamp((t - i * 0.07) / 0.6, 0, 1);
    const y = cy - (1 - outBack(k)) * 120;
    ctx.globalAlpha = k;
    ctx.fillStyle = '#ff2050'; ctx.fillText(ch, x + 3, y + 3);
    ctx.fillStyle = '#fff'; ctx.fillText(ch, x, y);
    x += w;
  }
  ctx.globalAlpha = clamp((t - 0.8) / 0.4, 0, 1);
  ctx.textAlign = 'center';
  const cnt = Math.round(score * outCubic(clamp((t - 0.8) / 1.2, 0, 1)));
  ctx.font = `900 ${Math.min(40, W / 12)}px ${FONT}`; ctx.fillStyle = '#ffe14d'; ctx.fillText(cnt, W / 2, cy + fs * 1.1);
  ctx.font = `700 ${Math.min(14, W / 30)}px ${FONT}`; ctx.fillStyle = 'rgba(200,230,255,0.8)';
  fitText(`STAGE ${stage}   ·   MAX COMBO ${maxCombo}   ·   BEST ${best}`, W / 2, cy + fs * 1.1 + 40, W - 32);
  if (newRecord && t > 2) { const s = 1 + Math.sin(t * 8) * 0.08; ctx.save(); ctx.translate(W / 2, cy + fs * 1.1 + 76); ctx.scale(s, s); ctx.font = `900 22px ${FONT}`; ctx.fillStyle = '#ff7bf2'; ctx.fillText('NEW RECORD!', 0, 0); ctx.restore(); }
  if (t > 1.2) { ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 4); ctx.font = `700 16px ${KFONT}`; ctx.fillStyle = '#fff'; ctx.fillText(isTouch ? '탭하여 다시 시작' : '클릭 / ENTER 로 다시 시작', W / 2, H * 0.72); }
  ctx.globalAlpha = 1;
}
function drawStreaks() {
  const k = boostK; if (k < 0.05) return;
  ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(200,240,255,${0.22 * k})`; ctx.lineWidth = 1.5;
  const D = Math.hypot(W, H) * 0.5;
  ctx.beginPath();
  for (let i = 0; i < 36; i++) { const a = rand(0, TAU), r1 = rand(0.3, 0.9) * D, r2 = r1 + rand(80, 260) * k; ctx.moveTo(CX + Math.cos(a) * r1, CY + Math.sin(a) * r1); ctx.lineTo(CX + Math.cos(a) * r2, CY + Math.sin(a) * r2); }
  ctx.stroke(); ctx.globalCompositeOperation = 'source-over';
}
function drawCracks() {
  const lowHp = player && player.alive && player.hp <= 2;
  for (const c of cracks) {
    const a = Math.max(1 - c.t / 2.5, lowHp ? 0.3 : 0); if (a <= 0) continue;
    for (const pass of [0, 1]) {
      ctx.strokeStyle = pass ? `rgba(220,240,255,${a * 0.8})` : `rgba(0,0,0,${a * 0.5})`; ctx.lineWidth = pass ? 1.2 : 3;
      ctx.beginPath();
      for (const ln of c.lines) { ctx.moveTo(ln[0][0], ln[0][1]); for (let i = 1; i < ln.length; i++) ctx.lineTo(ln[i][0], ln[i][1]); }
      ctx.stroke();
    }
  }
}
function drawOverlay() {
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  const lowHp = player && player.alive && player.hp <= 2 && state === 'play';
  const ra = hurtT * 0.6 + (lowHp ? 0.22 + 0.12 * Math.sin(T * 6) : 0);
  if (ra > 0.01) {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.72);
    g.addColorStop(0, 'rgba(255,0,40,0)'); g.addColorStop(1, `rgba(255,0,40,${Math.min(0.8, ra)})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  drawCracks();
  if (flash > 0) { ctx.globalAlpha = Math.min(1, flash) * 0.8; ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}
function postAberration() {
  if (aberr < 0.03) return;
  const w = cv.width, h = cv.height, d = Math.round(aberr * 9 * DPR) + 1;
  abAc.globalCompositeOperation = 'copy'; abAc.drawImage(cv, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = 'lighter';
  for (const [col, ox, oy] of [['#ff0000', -d, 0], ['#00ff00', 0, 0], ['#0000ff', d, Math.round(d * 0.3)]]) {
    abBc.globalCompositeOperation = 'copy'; abBc.drawImage(abA, 0, 0);
    abBc.globalCompositeOperation = 'multiply'; abBc.fillStyle = col; abBc.fillRect(0, 0, w, h);
    ctx.drawImage(abB, ox, oy);
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

// ================== 렌더 ==================
const dl = [];
function drawObjects(near) {
  dl.length = 0;
  for (const e of enemies) if (e.type !== 'bpart' && !e.dead && (near ? e.z < ZP : e.z >= ZP)) dl.push(e);
  for (const o of obstacles) if (!o.dead && (near ? o.z < ZP : o.z >= ZP)) dl.push(o);
  for (const k of pickups) if (near ? k.z < ZP : k.z >= ZP) dl.push(k);
  if (!near) { if (boss) dl.push(boss); if (bossDeath) dl.push(bossDeath.b); }
  dl.sort((a, b) => b.z - a.z);
  for (const o of dl) {
    if (o.cat === 'enemy') drawEnemy(o);
    else if (o.cat === 'obs') drawObs(o);
    else if (o.cat === 'pick') drawPickup(o);
    else if (o.cat === 'boss') drawBoss(o, !!bossDeath && o === bossDeath.b);
  }
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalCompositeOperation = 'source-over';
  // 부스트 시 이전 프레임 잔상 (모션 블러)
  ctx.globalAlpha = 1 - boostK * 0.5; ctx.fillStyle = `hsl(${hue},40%,4%)`; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  ctx.save();
  const sx = shake > 0.5 ? rand(-1, 1) * shake : 0, sy = shake > 0.5 ? rand(-1, 1) * shake : 0;
  ctx.translate(CX + sx, CY + sy); ctx.rotate(camRoll); ctx.translate(-CX, -CY);
  drawSky();
  drawStarList(stars, 1);
  drawEnv();
  drawStarList(dust, 0.35);
  if (state !== 'title') {
    drawObjects(false);
    drawLasers();
    drawEBullets();
    drawParts();
    if (player.alive) {
      const blink = player.inv > 0 && state === 'play' ? (Math.sin(T * 40) > 0 ? 0.35 : 1) : 1;
      drawShip(player, blink);
      if (player.inv > 0 && state === 'play') {
        proj(player.x, player.y, ZP);
        ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(120,240,255,${0.35 * Math.min(1, player.inv)})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(PX, PY, 18 * PS * 0.5 + 10 + Math.sin(T * 10) * 3, 0, TAU); ctx.stroke(); ctx.globalCompositeOperation = 'source-over';
      }
    }
    drawObjects(true);
    drawReticle();
  } else {
    drawParts();
    drawShip(player, 1);
  }
  ctx.restore();
  drawStreaks();
  drawTexts();
  if (state === 'play' || state === 'dying') drawHUD();
  drawBanner();
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
  drawOverlay();
  postAberration();
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 48px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.font = `600 14px ${KFONT}`; ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillText('P 키 또는 클릭/탭으로 계속', W / 2, H / 2 + 44);
  }
  if (muted) { ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.font = `700 11px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillText('MUTED', W - 18, H - 8); }
}

// ================== 루프 ==================
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (!paused) {
    T += rdt;
    if (hitstop > 0) { hitstop -= rdt; shake *= Math.exp(-7 * rdt); }
    else {
      slowmo = Math.max(0, slowmo - rdt);
      timeScale = lerp(timeScale, slowmo > 0 ? 0.3 : 1, 1 - Math.exp(-8 * rdt));
      update(rdt * timeScale, rdt);
    }
  }
  render();
  requestAnimationFrame(frame);
}
resize(); addEventListener('resize', resize);
initWorld();
resetGame();
requestAnimationFrame(frame);
</script>
