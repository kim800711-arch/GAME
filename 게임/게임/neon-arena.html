<script>
"use strict";
// ================== 기본 셋업 ==================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, vignette = null, zoom = 1, curZ = 1;
const FONT = '"Orbitron","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif';
const KFONT = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif';
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[(Math.random() * arr.length) | 0];
const mod = (a, n) => ((a % n) + n) % n;
const outBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; };
// 아레나 (월드) 크기
const AW = 2600, AH = 1800;
// 색수차용 버퍼
const caR = document.createElement('canvas'), caB = document.createElement('canvas');
const caRx = caR.getContext('2d'), caBx = caB.getContext('2d');

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.max(1, (W * DPR) | 0); cv.height = Math.max(1, (H * DPR) | 0);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.7)');
  zoom = clamp(Math.min(W, H) / 760, 0.5, 1);
  caR.width = caB.width = Math.max(1, (W / 2) | 0);
  caR.height = caB.height = Math.max(1, (H / 2) | 0);
  initStars();
}

// ================== 사운드 (WebAudio 합성) ==================
let AC = null, master = null, noiseBuf = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f1, f2, dur, type = 'square', vol = 0.1, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 1000) {
  if (!AC || muted) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
const sfxT = {};
const gate = (k, gap) => { if (T - (sfxT[k] || -9) < gap) return false; sfxT[k] = T; return true; };
const SFX = {
  shoot: () => tone(900, 320, 0.06, 'square', 0.014),
  laser: () => tone(1900, 500, 0.09, 'sawtooth', 0.014),
  hit: () => { if (gate('hit', 0.04)) tone(340, 150, 0.05, 'sawtooth', 0.025); },
  clang: () => { if (gate('clang', 0.06)) tone(2400, 1700, 0.05, 'square', 0.02); },
  boom: () => { if (!gate('boom', 0.03)) return; noise(0.45, 0.28, 2200); tone(180, 40, 0.3, 'sine', 0.2); },
  big: () => { noise(1.6, 0.5, 2800); tone(120, 22, 1.4, 'sine', 0.45); },
  power: () => { tone(500, 1500, 0.2, 'triangle', 0.12); tone(800, 2200, 0.2, 'triangle', 0.1, 0.08); },
  hurt: () => { noise(0.35, 0.45, 900); tone(220, 50, 0.35, 'sawtooth', 0.16); },
  bomb: () => { noise(1.6, 0.55, 4000); tone(70, 25, 1.5, 'sine', 0.55); tone(400, 60, 0.8, 'sawtooth', 0.08); },
  warn: () => { for (let i = 0; i < 3; i++) { tone(520, 520, 0.22, 'square', 0.07, i * 0.5); tone(390, 390, 0.22, 'square', 0.07, i * 0.5 + 0.25); } },
  start: () => { tone(300, 900, 0.3, 'sawtooth', 0.08); tone(600, 1800, 0.35, 'triangle', 0.08, 0.1); },
  shard: () => { if (gate('shard', 0.035)) tone(1100 + Math.min(1500, mult * 70), 2400 + Math.min(1500, mult * 70), 0.06, 'sine', 0.035); },
  spawn: () => { if (gate('spawn', 0.1)) tone(110, 700, 0.4, 'triangle', 0.035); },
  ring: () => { if (gate('ring', 0.1)) tone(640, 180, 0.25, 'triangle', 0.06); },
  streak: () => { tone(400, 1200, 0.15, 'square', 0.05); tone(800, 2400, 0.2, 'triangle', 0.05, 0.07); },
  beam: () => { noise(0.9, 0.2, 3200); tone(90, 55, 0.9, 'sawtooth', 0.14); },
  dash: () => { noise(0.4, 0.25, 1500); tone(300, 80, 0.35, 'sawtooth', 0.08); },
};

// ================== 글로우 스프라이트 캐시 ==================
const glowCache = {};
function glowSprite(color) {
  if (glowCache[color]) return glowCache[color];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.22, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return (glowCache[color] = c);
}
function drawGlow(x, y, r, color, a = 1) {
  if (r <= 0 || a <= 0) return;
  ctx.globalAlpha = Math.min(1, a);
  ctx.drawImage(glowSprite(color), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
}
// 네온 선: 현재 path 를 넓고 흐린 선 + 밝은 선 + 흰 심지로 그림 ('lighter' 모드 전제)
function neon(col, w, fillA = 0, a = 1) {
  if (fillA) { ctx.globalAlpha = fillA * a; ctx.fillStyle = col; ctx.fill(); }
  ctx.strokeStyle = col;
  ctx.globalAlpha = 0.2 * a; ctx.lineWidth = w * 4.5; ctx.stroke();
  ctx.globalAlpha = a; ctx.lineWidth = w; ctx.stroke();
  ctx.globalAlpha = 0.75 * a; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = w * 0.35; ctx.stroke();
  ctx.globalAlpha = 1;
}
// 화면 폭에 맞춰 글꼴 크기를 줄임 (ctx.font 설정 후 크기 반환)
function fitFont(txt, size, maxW, weight = 900, fam = FONT) {
  ctx.font = `${weight} ${size}px ${fam}`;
  const w = ctx.measureText(txt).width;
  if (w > maxW) { size = Math.max(8, Math.floor(size * maxW / w)); ctx.font = `${weight} ${size}px ${fam}`; }
  return size;
}
function polyPath(n, r, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) { const a = rot + i / n * TAU; if (i) ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath();
}

// ================== 스프링-질량 그리드 (시그니처 효과) ==================
const GS = 40, GCOLS = Math.floor(AW / GS) + 1, GROWS = Math.floor(AH / GS) + 1, GN = GCOLS * GROWS;
const gox = new Float32Array(GN), goy = new Float32Array(GN), gvx = new Float32Array(GN), gvy = new Float32Array(GN);
let gridHue = 195, gridHueTarget = 195;
function gridReset() { gox.fill(0); goy.fill(0); gvx.fill(0); gvy.fill(0); }
function gridBounds(x, y, r) {
  return [Math.max(1, Math.floor((x - r) / GS)), Math.min(GCOLS - 2, Math.ceil((x + r) / GS)), Math.max(1, Math.floor((y - r) / GS)), Math.min(GROWS - 2, Math.ceil((y + r) / GS))];
}
// 방사형 충격 (f>0 밀어냄, f<0 끌어당김)
function gridPush(x, y, r, f) {
  const [i0, i1, j0, j1] = gridBounds(x, y, r), r2 = r * r;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const dx = i * GS - x, dy = j * GS - y, d2 = dx * dx + dy * dy;
    if (d2 < r2 && d2 > 0.01) { const d = Math.sqrt(d2), fall = 1 - d / r, s = f * fall * fall / d, k = j * GCOLS + i; gvx[k] += dx * s; gvy[k] += dy * s; }
  }
}
// 소용돌이 (접선 방향 + 약한 흡입)
function gridSwirl(x, y, r, f) {
  const [i0, i1, j0, j1] = gridBounds(x, y, r), r2 = r * r;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const dx = i * GS - x, dy = j * GS - y, d2 = dx * dx + dy * dy;
    if (d2 < r2 && d2 > 1) { const d = Math.sqrt(d2), s = f * (1 - d / r) / d, k = j * GCOLS + i; gvx[k] += (-dy - dx * 0.3) * s; gvy[k] += (dx - dy * 0.3) * s; }
  }
}
// 퍼지는 링 형태의 충격파
function gridRing(x, y, rad, band, f) {
  const R = rad + band, [i0, i1, j0, j1] = gridBounds(x, y, R), in2 = Math.max(0, rad - band) ** 2, out2 = R * R;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const dx = i * GS - x, dy = j * GS - y, d2 = dx * dx + dy * dy;
    if (d2 < out2 && d2 > in2 && d2 > 1) { const d = Math.sqrt(d2), s = f * (1 - Math.abs(d - rad) / band) / d, k = j * GCOLS + i; gvx[k] += dx * s; gvy[k] += dy * s; }
  }
}
function gridUpdate(dt) {
  if (dt <= 0) return;
  const steps = Math.max(1, Math.min(3, Math.ceil(dt * 60 - 0.01))), h = dt / steps, C = GCOLS;
  const KS = 30, KC = 260, D = 4.2, LIM = 48;
  for (let s = 0; s < steps; s++) {
    for (let j = 1; j < GROWS - 1; j++) {
      let k = j * C + 1;
      for (let i = 1; i < C - 1; i++, k++) {
        const lx = (gox[k - 1] + gox[k + 1] + gox[k - C] + gox[k + C]) * 0.25 - gox[k];
        const ly = (goy[k - 1] + goy[k + 1] + goy[k - C] + goy[k + C]) * 0.25 - goy[k];
        gvx[k] += (lx * KC - gox[k] * KS - gvx[k] * D) * h;
        gvy[k] += (ly * KC - goy[k] * KS - gvy[k] * D) * h;
      }
    }
    for (let j = 1; j < GROWS - 1; j++) {
      let k = j * C + 1;
      for (let i = 1; i < C - 1; i++, k++) {
        let x = gox[k] + gvx[k] * h, y = goy[k] + gvy[k] * h;

function drawGrid(v) {
  const i0 = Math.max(0, Math.floor(v.x0 / GS)), i1 = Math.min(GCOLS - 1, Math.ceil(v.x1 / GS));

  const P0 = new Path2D(), PM = new Path2D(), P1 = new Path2D(), P2 = new Path2D();
  const seg = (k, k2, x1, y1, x2, y2, major) => {
    const m = Math.abs(gox[k]) + Math.abs(goy[k]) + Math.abs(gox[k2]) + Math.abs(goy[k2]);
    const P = m > 14 ? P2 : m > 4 ? P1 : major ? PM : P0;
    P.moveTo(x1 + gox[k], y1 + goy[k]); P.lineTo(x2 + gox[k2], y2 + goy[k2]);
  };
  for (let j = j0; j <= j1; j++) {
    const yb = j * GS, major = j % 5 === 0;
    for (let i = i0; i < i1; i++) { const k = j * GCOLS + i; seg(k, k + 1, i * GS, yb, (i + 1) * GS, yb, major); }
  }
  for (let i = i0; i <= i1; i++) {
    const xb = i * GS, major = i % 5 === 0;
    for (let j = j0; j < j1; j++) { const k = j * GCOLS + i; seg(k, k + GCOLS, xb, j * GS, xb, (j + 1) * GS, major); }
  }
  ctx.lineWidth = 1; ctx.strokeStyle = `hsla(${gridHue},90%,55%,0.15)`; ctx.stroke(P0);
  ctx.lineWidth = 1.4; ctx.strokeStyle = `hsla(${gridHue},90%,60%,0.3)`; ctx.stroke(PM);
  ctx.lineWidth = 1.6; ctx.strokeStyle = `hsla(${gridHue + 25},100%,65%,0.55)`; ctx.stroke(P1);
  ctx.lineWidth = 7; ctx.strokeStyle = `hsla(${gridHue + 50},100%,65%,0.2)`; ctx.stroke(P2);
  ctx.lineWidth = 2; ctx.strokeStyle = `hsla(${gridHue + 50},100%,82%,0.95)`; ctx.stroke(P2);
}

// ================== 배경 (별 / 성운 패럴랙스) ==================
let stars = [], nebulae = [];
function initStars() {
  stars = [];
  const n = Math.min(420, Math.floor(W * H / 2600));
  for (let i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * 0.9 + 0.1, tw: rand(0, TAU) });
  nebulae = [];
  for (let i = 0; i < 4; i++) nebulae.push({ x: rand(0, W + 800), y: rand(0, H + 800), r: rand(260, 520), h: rand(0, 360) });
}
function drawBg() {
  ctx.fillStyle = '#03020a'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (const n of nebulae) {
    const x = mod(n.x - cam.x * 0.08 * zoom, W + 2 * n.r) - n.r, y = mod(n.y - cam.y * 0.08 * zoom, H + 2 * n.r) - n.r;
    const g = ctx.createRadialGradient(x, y, 0, x, y, n.r);
    g.addColorStop(0, `hsla(${n.h + gridHue},80%,45%,0.1)`); g.addColorStop(1, `hsla(${n.h + gridHue},80%,45%,0)`);
    ctx.fillStyle = g; ctx.fillRect(x - n.r, y - n.r, n.r * 2, n.r * 2);
  }
  for (const s of stars) {
    const px = mod(s.x - cam.x * s.z * 0.45 * zoom, W), py = mod(s.y - cam.y * s.z * 0.45 * zoom, H);
    const a = (0.2 + 0.7 * s.z) * (0.7 + 0.3 * Math.sin(T * 2 + s.tw)), sz = 0.6 + s.z * 1.7;
    ctx.fillStyle = s.z > 0.8 ? `rgba(170,230,255,${a})` : `rgba(255,255,255,${a})`;
    ctx.fillRect(px, py, sz, sz);
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ================== 게임 상태 ==================
let state = 'title', T = 0, titleT = 0, titleBoom = 0, overT = 0, paused = false;
let timeScale = 1, slowmo = 0, hitstop = 0, shake = 0, flash = 0, flashColor = '#fff', chroma = 0, zoomKick = 0, borderPulse = 0;
let player, pbullets, ebullets, enemies, portals, parts, rings, texts, stexts, shards, pickups, spawnQueue, timers, wallHits;
let score = 0, shownScore = 0, scoreBump = 0, mult = 1, maxMult = 1, multBump = 0, multT = 0, streak = 0, streakT = 0, bestStreak = 0, kills = 0;
let wave = 0, waveTime = 0, waveClearT = -1, banner = null, boss = null, bossDeath = null, nova = null, novaId = 0, nextId = 1;
let best = 0, newRecord = false, lastInput = 'mouse', isTouch = false, hpShake = 0, autoFire = false;
const cam = { x: AW / 2, y: AH / 2 };
try { best = +localStorage.getItem('neonVortexBest') || 0; } catch (e) { best = 0; }

function resetGame() {
  player = {
    x: AW / 2, y: AH / 2, vx: 0, vy: 0, ang: -Math.PI / 2, hp: 3, maxHp: 3, bombs: 2, inv: 2.2, fireT: 0, alive: true,
    recoil: 0, thrust: 0, ix: 0, iy: 0, pw: { rapid: 0, spread: 0, laser: 0, shield: 0, drones: 0 }, droneA: 0, droneT: 0, shot: 0,
  };
  pbullets = []; ebullets = []; enemies = []; portals = []; parts = []; rings = []; texts = []; stexts = [];
  shards = []; pickups = []; spawnQueue = []; timers = []; wallHits = [];
  score = 0; shownScore = 0; mult = 1; maxMult = 1; multT = 0; streak = 0; streakT = 0; bestStreak = 0; kills = 0;
  wave = 0; waveTime = 0; waveClearT = -1; banner = null; boss = null; bossDeath = null; nova = null;
  newRecord = false; slowmo = 0; timeScale = 1; hitstop = 0;
}
function startGame() {
  initAudio(); SFX.start();
  resetGame(); state = 'play'; paused = false; overT = 0;
  sticks.move = null; sticks.aim = null; mouse.down = false;
  if (!mouse.seen) { mouse.sx = W / 2 + 1; mouse.sy = H / 2 - 120; }
  cam.x = player.x; cam.y = player.y;
  flash = 0.6; flashColor = '#9ffcff'; chroma = 0.9; zoomKick = 1.2;
  rings.push({ x: player.x, y: player.y, r: 0, max: 520, t: 0, life: 0.9, col: '#7dfcff', w: 16, push: 700 });
  gridPush(player.x, player.y, 420, 900);
  neonExplode(player.x, player.y, 1.2, '#7dfcff');
  nextWave();
}

// ================== 적 정의 / 웨이브 ==================
const ET = {
  wander: { hp: 2, r: 15, score: 50, col: '#3d8bff', shards: 2, drop: 0.03 },
  chaser: { hp: 2, r: 13, score: 80, col: '#ff3dc8', shards: 2, drop: 0.03 },
  splitter: { hp: 6, r: 22, score: 150, col: '#6dff3d', shards: 3, drop: 0.1 },
  mini: { hp: 2, r: 11, score: 40, col: '#c8ff3d', shards: 1, drop: 0.02 },
  snake: { hp: 16, r: 16, score: 500, col: '#ff9a2e', shards: 12, drop: 0.4 },
  turret: { hp: 20, r: 24, score: 400, col: '#ffe03d', shards: 8, drop: 0.35 },
  boss: { hp: 1, r: 66, score: 20000, col: '#ff3d6e', shards: 60, drop: 0 },
};
function q(t, f) { spawnQueue.push({ t, f }); }
function farPos(minD = 340, margin = 90) {
  for (let i = 0; i < 40; i++) {
    const x = rand(margin, AW - margin), y = rand(margin, AH - margin);
    if (Math.hypot(x - player.x, y - player.y) > minD) return { x, y };
  }
  return { x: player.x < AW / 2 ? AW - margin : margin, y: rand(margin, AH - margin) };
}
const GROUPS = {
  ring() { q(0, () => { const c = farPos(440, 220), n = 6 + Math.min(4, wave >> 1), R = 110; for (let i = 0; i < n; i++) { const a = i / n * TAU; openPortal('wander', c.x + Math.cos(a) * R, c.y + Math.sin(a) * R, {}, 1 + i * 0.05); } }); },
  drift() { q(0, () => { for (let i = 0; i < 5; i++) { const c = farPos(); openPortal('wander', c.x, c.y, {}, 1 + i * 0.08); } }); },
  chasers() { q(0, () => { const c = farPos(480, 160), n = 3 + Math.min(4, (wave / 2) | 0), a = rand(0, TAU); for (let i = 0; i < n; i++) { const o = (i - (n - 1) / 2) * 52; openPortal('chaser', clamp(c.x + Math.cos(a) * o, 60, AW - 60), clamp(c.y + Math.sin(a) * o, 60, AH - 60), {}, 1 + i * 0.07); } }); },
  corners() { q(0, () => { const m = 130; [[m, m], [AW - m, m], [m, AH - m], [AW - m, AH - m]].forEach((p, i) => openPortal('chaser', p[0], p[1], {}, 1.1 + i * 0.05)); }); },
  splitter() { const n = wave >= 6 ? 2 : 1; for (let i = 0; i < n; i++) q(i * 0.4, () => { const c = farPos(); openPortal('splitter', c.x, c.y); }); },
  snake() { q(0, () => { const c = farPos(520, 220); openPortal('snake', c.x, c.y, {}, 1.3); }); },
  turret() { q(0, () => { const c = farPos(460, 220); openPortal('turret', c.x, c.y, {}, 1.3); }); },

  ctx.textAlign = 'center';
  const sub = '일렁이는 네온 그리드 위, 끝없는 소용돌이에서 살아남아라';
  fitFont(sub, Math.min(18, W / 22), W * 0.92, 700, KFONT); ctx.fillStyle = 'rgba(190,240,255,0.9)';
  ctx.fillText(sub, W / 2, subY);
  const blink = 0.5 + 0.5 * Math.sin(t * 4);
  fitFont('CLICK / TAP / SPACE', Math.min(22, W / 18), W * 0.9); ctx.fillStyle = `rgba(255,225,77,${0.4 + blink * 0.6})`;
  ctx.fillText('CLICK / TAP / SPACE', W / 2, promptY);
  if (best > 0) { ctx.font = `700 13px ${FONT}`; ctx.fillStyle = 'rgba(255,225,77,0.85)'; ctx.fillText('BEST ' + best, W / 2, bestY); }
  const lines = isTouch
    ? ['왼쪽 스틱: 이동  ·  오른쪽 스틱: 조준 + 사격', 'NOVA 버튼: 폭탄  ·  하단 버튼: 일시정지']
    : ['WASD 이동  ·  마우스 조준  ·  좌클릭 사격 (F 자동 사격)', 'SPACE / 우클릭: 노바 폭탄  ·  P 일시정지  ·  M 소리'];
  lines.push('적이 남긴 에너지 조각을 모아 점수 배율을 올리세요');
  lines.forEach((ln, i) => {
    fitFont(ln, 14, W * 0.94, 600, KFONT);
    ctx.fillStyle = i === 2 ? 'rgba(160,255,200,0.65)' : 'rgba(255,255,255,0.6)';
    ctx.fillText(ln, W / 2, instrY + i * 22);
  });
}
function drawOver() {
  const t = overT;
  ctx.fillStyle = `rgba(3,2,10,${Math.min(0.72, t * 0.8)})`; ctx.fillRect(0, 0, W, H);
  const txt = 'GAME OVER', fs = fitFont(txt, Math.min(72, W / 8), W * 0.88);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const tw = ctx.measureText(txt).width; let x = W / 2 - tw / 2; const cy = H * 0.32;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i], w = ctx.measureText(ch).width, k = clamp((t - i * 0.07) / 0.6, 0, 1);
    const y = cy - (1 - outBack(k)) * 130;
    ctx.globalAlpha = k;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,0,90,0.7)'; ctx.fillText(ch, x - 3, y + 2);
    ctx.fillStyle = 'rgba(0,200,255,0.7)'; ctx.fillText(ch, x + 3, y - 2);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#ffffff'; ctx.fillText(ch, x, y);
    x += w;
  }
  ctx.globalAlpha = clamp((t - 0.8) / 0.4, 0, 1);
  ctx.textAlign = 'center';
  const cnt = Math.round(score * outCubic(clamp((t - 0.8) / 1.2, 0, 1)));
  ctx.font = `900 ${Math.min(42, W / 11)}px ${FONT}`; ctx.fillStyle = '#ffe14d'; ctx.fillText(String(cnt), W / 2, cy + fs * 1.1);
  ctx.font = `700 ${Math.min(14, W / 30)}px ${FONT}`; ctx.fillStyle = 'rgba(200,240,255,0.85)';
  ctx.fillText(`WAVE ${wave}  ·  KILLS ${kills}  ·  MAX x${maxMult.toFixed(1)}  ·  STREAK ${bestStreak}`, W / 2, cy + fs * 1.1 + 40);
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillText('BEST ' + best, W / 2, cy + fs * 1.1 + 64);
  if (newRecord && t > 2) { const s = 1 + Math.sin(t * 8) * 0.08; ctx.save(); ctx.translate(W / 2, cy + fs * 1.1 + 100); ctx.scale(s, s); ctx.font = `900 22px ${FONT}`; ctx.fillStyle = '#ff5cf4'; ctx.fillText('NEW RECORD!', 0, 0); ctx.font = `700 13px ${KFONT}`; ctx.fillText('최고 기록 갱신!', 0, 24); ctx.restore(); }
  if (t > 1.2) { ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 4); ctx.font = `700 16px ${KFONT}`; ctx.fillStyle = '#ffffff'; ctx.fillText('클릭 / 탭 / SPACE 로 다시 시작', W / 2, H * 0.76); }
  ctx.globalAlpha = 1;
}

// ================== 렌더 ==================
function applyCA(a) {
  const bw = caR.width, bh = caR.height;
  for (const [g, col] of [[caRx, '#ff0040'], [caBx, '#00b0ff']]) {
    g.globalCompositeOperation = 'copy'; g.drawImage(cv, 0, 0, bw, bh);
    g.globalCompositeOperation = 'multiply'; g.fillStyle = col; g.fillRect(0, 0, bw, bh);
  }
  const off = Math.min(1.5, a) * 10;
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(0.55, a * 0.45);
  ctx.drawImage(caR, off, 0, W, H); ctx.drawImage(caB, -off, off * 0.3, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function render() {
  const Z = zoom * (1 + zoomKick * 0.06); curZ = Z;
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  drawBg();
  ctx.save();
  const sx = shake > 0.4 ? rand(-1, 1) * shake : 0, sy = shake > 0.4 ? rand(-1, 1) * shake : 0;
  ctx.translate(W / 2 + sx, H / 2 + sy);
  if (shake > 2) ctx.rotate(rand(-1, 1) * shake * 0.0007);
  ctx.scale(Z, Z); ctx.translate(-cam.x, -cam.y);
  const hw = W / 2 / Z + 80, hh = H / 2 / Z + 80;
  const v = { x0: cam.x - hw, x1: cam.x + hw, y0: cam.y - hh, y1: cam.y + hh };
  const inV = (x, y, m) => x > v.x0 - m && x < v.x1 + m && y > v.y0 - m && y < v.y1 + m;
  ctx.globalCompositeOperation = 'lighter';
  drawGrid(v); drawBorder();
  drawShards(v); drawPickups();
  for (const p of portals) if (inV(p.x, p.y, p.big ? 300 : 80)) drawPortal(p);
  for (const e of enemies) if (e.type !== 'boss' && (e.type === 'snake' || inV(e.x, e.y, 60))) drawEnemy(e);
  if (boss && !boss.dead) drawBoss(boss, false);
  if (bossDeath) drawBoss(bossDeath.e, true);
  drawPBullets(v);
  if (state !== 'title' && player.alive) drawPlayer();
  drawParts();
  drawEBullets(v);
  if (nova) { ctx.globalAlpha = 0.07; ctx.fillStyle = '#99ffff'; ctx.beginPath(); ctx.arc(nova.x, nova.y, nova.r, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
  ctx.globalCompositeOperation = 'source-over';
  drawTexts(texts);
  ctx.restore();
  if (state === 'title') { drawTitle(); drawOverlay(); return; }
  if (state === 'play' || state === 'dying') { drawIndicators(Z); drawHUD(); }
  drawTexts(stexts);
  drawBanner();
  if (state === 'over') drawOver();
  drawOverlay();
}
function drawOverlay() {
  if (chroma > 0.04) applyCA(chroma);
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  if (flash > 0) { ctx.globalAlpha = Math.min(1, flash) * 0.75; ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (player && player.alive && player.hp <= 1 && state === 'play') {
    const a = 0.25 + 0.15 * Math.sin(T * 6);
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(255,0,40,0)'); g.addColorStop(1, `rgba(255,0,40,${a})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 ${Math.min(48, W / 8)}px ${FONT}`; ctx.fillStyle = '#ffffff'; ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.font = `600 14px ${KFONT}`; ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillText('일시정지 — P 키 또는 클릭 / 탭으로 계속', W / 2, H / 2 + 44);
  }
  if (muted) { ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.font = `700 11px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillText('MUTED', W - 16, H - 8); }
}

// ================== 루프 ==================
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (!paused) {
    T += rdt;
    if (hitstop > 0) { hitstop -= rdt; shake *= Math.exp(-7 * rdt); }
    else {
      slowmo = Math.max(0, slowmo - rdt);
      timeScale = lerp(timeScale, slowmo > 0 ? 0.3 : 1, 1 - Math.exp(-8 * rdt));
      update(rdt * timeScale, rdt);
    }
  }
  render();
  requestAnimationFrame(frame);
}
resize(); addEventListener('resize', resize);
resetGame();
requestAnimationFrame(frame);
</script>
