<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Thunder Raid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#07060f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// ================== 기본 셋업 ==================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, vignette = null, GY = 0, US = 1;
const FONT = '"Orbitron","Segoe UI","Malgun Gothic",sans-serif';
const KFONT = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif';
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[(Math.random() * arr.length) | 0];
const outBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const outCubic = t => 1 - Math.pow(1 - t, 3);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const wrapA = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = (W * DPR) | 0; cv.height = (H * DPR) | 0;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  GY = Math.round(H - clamp(H * 0.13, 56, 110));
  US = clamp(Math.min(W, H) / 720, 0.72, 1);
  vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.6)');
  initWorld();
  if (enemies) for (const e of enemies) if (e.ground) e.y = GY - (e.type === 'tank' ? 12 : 2);
}

// ================== 사운드 (WebAudio 합성) ==================
let AC = null, master = null, noiseBuf = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f1, f2, dur, type = 'square', vol = 0.1, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 1000, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
let lastHitSfx = 0, lastBoomSfx = 0, lastGndSfx = 0, lastFlakSfx = 0;
const SFX = {
  shoot: () => tone(900, 260, 0.045, 'square', 0.014),
  hit: () => { if (T - lastHitSfx < 0.04) return; lastHitSfx = T; tone(320, 140, 0.05, 'sawtooth', 0.03); },
  boom: () => { if (T - lastBoomSfx < 0.03) return; lastBoomSfx = T; noise(0.5, 0.3, 1800); tone(170, 40, 0.35, 'sine', 0.22); },
  ground: () => { if (T - lastGndSfx < 0.05) return; lastGndSfx = T; noise(0.7, 0.35, 900); tone(90, 30, 0.5, 'sine', 0.25); },
  flak: () => { if (T - lastFlakSfx < 0.06) return; lastFlakSfx = T; noise(0.18, 0.12, 2500); },
  big: () => { noise(1.6, 0.5, 2600); tone(120, 22, 1.4, 'sine', 0.45); },
  power: () => { tone(500, 1500, 0.2, 'triangle', 0.12); tone(800, 2200, 0.2, 'triangle', 0.1, 0.08); },
  hurt: () => { noise(0.35, 0.45, 900); tone(220, 50, 0.35, 'sawtooth', 0.16); },
  thunder: () => { noise(0.25, 0.6, 6000); noise(2.2, 0.55, 2200, 0.05); tone(90, 22, 1.8, 'sine', 0.5); for (let i = 0; i < 4; i++) tone(rand(1500, 3000), 200, 0.08, 'sawtooth', 0.05, i * 0.06); },
  warn: () => { for (let i = 0; i < 4; i++) { tone(440, 880, 0.4, 'sawtooth', 0.06, i * 0.8); tone(880, 440, 0.4, 'sawtooth', 0.06, i * 0.8 + 0.4); } },
  start: () => { tone(200, 700, 0.35, 'sawtooth', 0.08); tone(500, 1500, 0.35, 'triangle', 0.08, 0.1); noise(0.6, 0.15, 3000, 0.05); },
  missile: () => tone(200, 600, 0.12, 'triangle', 0.03),
  drop: () => tone(1400, 400, 0.3, 'sine', 0.03),
  rage: () => { tone(110, 55, 1.0, 'sawtooth', 0.15); tone(160, 60, 1.0, 'square', 0.06, 0.1); },
};

// ================== 글로우 스프라이트 캐시 ==================
const glowCache = {};
function glowSprite(color) {
  if (glowCache[color]) return glowCache[color];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.22, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return (glowCache[color] = c);
}
function drawGlow(x, y, r, color, a = 1) {
  if (r <= 0 || a <= 0) return;
  const pa = ctx.globalAlpha;
  ctx.globalAlpha = Math.min(1, a) * pa;
  ctx.drawImage(glowSprite(color), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = pa;
}
function lighter(fn) { const o = ctx.globalCompositeOperation; ctx.globalCompositeOperation = 'lighter'; fn(); ctx.globalCompositeOperation = o; }
function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); }

// ================== 팔레트 (낮→석양→황혼→밤) ==================
const PALS = [
  { top: [58, 128, 214], mid: [128, 182, 236], bot: [236, 222, 190], sun: [255, 246, 214], sunY: 0.14, sunR: 34, far: [132, 160, 198], near: [92, 118, 152], city: [58, 74, 100], g1: [104, 126, 74], g2: [46, 58, 36], cloud: [255, 255, 255], night: 0, haze: [214, 226, 238] },
  { top: [62, 52, 128], mid: [226, 112, 96], bot: [255, 196, 118], sun: [255, 190, 110], sunY: 0.44, sunR: 52, far: [128, 80, 118], near: [86, 52, 86], city: [48, 30, 58], g1: [86, 64, 56], g2: [34, 24, 28], cloud: [255, 200, 180], night: 0.3, haze: [255, 170, 140] },
  { top: [22, 20, 62], mid: [86, 50, 112], bot: [214, 104, 96], sun: [255, 128, 92], sunY: 0.66, sunR: 62, far: [62, 44, 86], near: [40, 30, 62], city: [24, 18, 42], g1: [46, 40, 56], g2: [16, 12, 22], cloud: [160, 120, 170], night: 0.7, haze: [170, 90, 120] },
  { top: [4, 6, 20], mid: [14, 20, 52], bot: [38, 40, 86], sun: [222, 232, 255], sunY: 0.18, sunR: 24, far: [28, 32, 60], near: [18, 22, 44], city: [10, 12, 28], g1: [26, 30, 42], g2: [8, 9, 16], cloud: [64, 74, 108], night: 1, haze: [40, 50, 90] },
];
const PHASE_NAME = ['DAY · 주간 작전', 'SUNSET · 석양 공습', 'DUSK · 황혼 침투', 'NIGHT · 야간 결전'];
let pal = JSON.parse(JSON.stringify(PALS[2])), palT = PALS[2];
function updPal(k) {
  for (const key in palT) {
    const b = palT[key];
    if (Array.isArray(b)) { const a = pal[key]; for (let i = 0; i < 3; i++) a[i] = lerp(a[i], b[i], k); }
    else pal[key] = lerp(pal[key], b, k);
  }
}
const rgb = (c, a = 1, m = 1) => `rgba(${Math.min(255, c[0] * m) | 0},${Math.min(255, c[1] * m) | 0},${Math.min(255, c[2] * m) | 0},${a})`;

// ================== 월드 / 패럴랙스 ==================
let scrollX = 0, scrollSpd = 150, boost = 0, clouds = [], stars = [], decals = [], bgBolt = null, bgBoltT = 4;
function initWorld() {
  stars = [];
  const n = Math.floor(W * GY / 2600);
  for (let i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.random() * GY * 0.75, z: Math.random() });
  if (!clouds.length) {
    for (let i = 0; i < 7; i++) clouds.push(makeCloud(rand(0, W), false));
    for (let i = 0; i < 3; i++) clouds.push(makeCloud(rand(0, W * 1.5), true));
  } else for (const c of clouds) c.y = Math.min(c.y, GY * 0.8);
}
function makeCloud(x, front) {
  const s = front ? rand(1.3, 2.1) : rand(0.55, 1.25), blobs = [];
  const n = 5 + ((Math.random() * 3) | 0);
  for (let i = 0; i < n; i++) blobs.push({ dx: rand(-70, 70), dy: rand(-16, 4), r: rand(20, 38) });
  return { x, y: front ? rand(GY * 0.1, GY * 0.85) : rand(GY * 0.04, GY * 0.55), s, sp: front ? rand(1.3, 1.8) : rand(0.12, 0.35), front, blobs };
}
function boltPts(x1, y1, x2, y2, d) {
  let pts = [[x1, y1], [x2, y2]], disp = d;
  for (let it = 0; it < 5; it++) {
    const np = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      np.push(a, [(a[0] + b[0]) / 2 + rand(-disp, disp), (a[1] + b[1]) / 2 + rand(-disp, disp) * 0.3]);
    }
    np.push(pts[pts.length - 1]); pts = np; disp *= 0.55;
  }
  return pts;
}
function updateWorld(dt, rdt) {
  updPal(1 - Math.exp(-0.5 * rdt));
  boost = Math.max(0, boost - rdt * 0.6);
  scrollSpd = 150 * (1 + boost * 2);
  scrollX += scrollSpd * dt;
  for (const c of clouds) {
    c.x -= scrollSpd * c.sp * dt;
    if (c.x < -120 * c.s) { Object.assign(c, makeCloud(W + 140 * c.s, c.front)); }
  }
  for (let i = decals.length - 1; i >= 0; i--) { decals[i].x -= scrollSpd * dt; if (decals[i].x < -100) decals.splice(i, 1); }
  // 밤 하늘 먼 번개
  if (pal.night > 0.65) {
    bgBoltT -= rdt;
    if (bgBoltT <= 0) { bgBoltT = rand(3, 8); const x = rand(W * 0.1, W * 0.9); bgBolt = { t: 0, pts: boltPts(x, -10, x + rand(-80, 80), GY * rand(0.4, 0.7), 50) }; if (!muted && AC) noise(1.5, 0.08, 400, 0.3); }
  }
  if (bgBolt) { bgBolt.t += rdt; if (bgBolt.t > 0.5) bgBolt = null; }
}
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, GY);
  g.addColorStop(0, rgb(pal.top)); g.addColorStop(0.55, rgb(pal.mid)); g.addColorStop(1, rgb(pal.bot));
  ctx.fillStyle = g; ctx.fillRect(-60, -60, W + 120, GY + 70);
  // 별
  if (pal.night > 0.3) {
    const a = (pal.night - 0.3) / 0.7;
    ctx.fillStyle = '#fff';
    for (const s of stars) {
      const sx = ((s.x - scrollX * 0.015 * (0.5 + s.z)) % W + W) % W;
      ctx.globalAlpha = a * (0.25 + 0.75 * s.z) * (0.6 + 0.4 * Math.sin(T * 2.3 + s.x));
      ctx.fillRect(sx, s.y, 1 + s.z * 1.4, 1 + s.z * 1.4);
    }
    ctx.globalAlpha = 1;
  }
  // 해 / 달
  const sx = W * 0.74, sy = GY * pal.sunY, sr = pal.sunR * US;
  const sg = ctx.createRadialGradient(sx, sy, sr * 0.5, sx, sy, sr * 5);
  sg.addColorStop(0, rgb(pal.sun, 0.55)); sg.addColorStop(1, rgb(pal.sun, 0));
  ctx.fillStyle = sg; ctx.fillRect(sx - sr * 5, sy - sr * 5, sr * 10, sr * 10);
  ctx.fillStyle = rgb(pal.sun); ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fill();
  if (pal.night > 0.85) { ctx.fillStyle = 'rgba(80,90,130,0.25)'; for (const [dx, dy, r] of [[-0.3, -0.2, 0.25], [0.25, 0.15, 0.18], [-0.05, 0.4, 0.12]]) { ctx.beginPath(); ctx.arc(sx + dx * sr, sy + dy * sr, r * sr, 0, TAU); ctx.fill(); } }
  // 지평선 연무
  const hg = ctx.createLinearGradient(0, GY * 0.55, 0, GY);
  hg.addColorStop(0, rgb(pal.haze, 0)); hg.addColorStop(1, rgb(pal.haze, 0.35));
  ctx.fillStyle = hg; ctx.fillRect(0, GY * 0.55, W, GY * 0.45);
  // 먼 번개
  if (bgBolt) {
    const k = 1 - bgBolt.t / 0.5, fl = Math.sin(bgBolt.t * 60) > -0.3 ? 1 : 0.3;
    ctx.fillStyle = `rgba(150,170,255,${0.12 * k * fl})`; ctx.fillRect(0, 0, W, GY);
    lighter(() => drawBolt(bgBolt.pts, k * fl * 0.7, 0.6));
  }
}
function ridge(off, base, amp, f1, f2, f3, col) {
  ctx.beginPath(); ctx.moveTo(-10, GY + 2);
  for (let x = -10; x <= W + 20; x += 10) {
    const u = x + off;
    const h = (Math.sin(u * f1) * 0.5 + Math.sin(u * f2 + 1.7) * 0.3 + Math.sin(u * f3 + 4.1) * 0.2) * 0.5 + 0.5;
    ctx.lineTo(x, base - h * amp);
  }
  ctx.lineTo(W + 20, GY + 2); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}
function drawBackClouds(front) {
  for (const c of clouds) {
    if (c.front !== front) continue;
    ctx.globalAlpha = front ? 0.32 : 0.85;
    ctx.fillStyle = rgb(pal.cloud, 1, 0.78);
    for (const b of c.blobs) { ctx.beginPath(); ctx.arc(c.x + b.dx * c.s, c.y + (b.dy + 5) * c.s, b.r * c.s, 0, TAU); ctx.fill(); }
    ctx.fillStyle = rgb(pal.cloud);
    for (const b of c.blobs) { ctx.beginPath(); ctx.arc(c.x + b.dx * c.s, c.y + b.dy * c.s, b.r * c.s * 0.92, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
function drawLand() {
  ridge(scrollX * 0.06, GY - GY * 0.16, GY * 0.32, 0.0042, 0.0113, 0.027, rgb(pal.far));
  const hz = ctx.createLinearGradient(0, GY * 0.5, 0, GY);
  hz.addColorStop(0, rgb(pal.haze, 0)); hz.addColorStop(1, rgb(pal.haze, 0.3));
  ctx.fillStyle = hz; ctx.fillRect(0, GY * 0.5, W, GY * 0.5);
  ridge(scrollX * 0.18 + 900, GY - GY * 0.05, GY * 0.2, 0.0061, 0.0157, 0.041, rgb(pal.near));
  // 도시 / 숲 레이어
  const off = scrollX * 0.42, bw = 52, i0 = Math.floor(off / bw) - 1, i1 = i0 + Math.ceil(W / bw) + 3;
  const night = pal.night, cityCol = rgb(pal.city);
  for (let i = i0; i < i1; i++) {
    const x = i * bw - off, seg = Math.floor(i * bw / 1100), forest = hash(seg * 3.1 + 7) < 0.45;
    ctx.fillStyle = cityCol;
    if (forest) {
      for (let k = 0; k < 3; k++) {
        const tx = x + k * 17 + hash(i * 3 + k) * 8, th = 22 + hash(i * 5 + k * 2) * 46;
        ctx.beginPath(); ctx.moveTo(tx - th * 0.28, GY); ctx.lineTo(tx, GY - th); ctx.lineTo(tx + th * 0.28, GY); ctx.closePath(); ctx.fill();
      }
    } else {
      const w = 30 + hash(i) * 18, h = 36 + hash(i + 0.5) * GY * 0.26;
      ctx.fillRect(x, GY - h, w, h);
      if (hash(i * 2.2) > 0.7) { ctx.fillRect(x + w / 2 - 1, GY - h - 18, 2, 18); if (night > 0.3 && Math.sin(T * 4 + i) > 0) lighter(() => drawGlow(x + w / 2, GY - h - 18, 6, '#ff3030', night)); }
      if (night > 0.05) {
        ctx.fillStyle = `rgba(255,214,130,${night * 0.75})`;
        const rows = Math.min(12, ((h - 8) / 10) | 0), cols = Math.max(1, ((w - 6) / 8) | 0);
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (hash(i * 13 + r * 7.3 + c * 1.9) > 0.58) ctx.fillRect(x + 4 + c * 8, GY - h + 6 + r * 10, 3, 4);
      }
    }
  }
}
function drawGround() {
  const gh = H - GY;
  const g = ctx.createLinearGradient(0, GY, 0, H);
  g.addColorStop(0, rgb(pal.g1)); g.addColorStop(1, rgb(pal.g2));
  ctx.fillStyle = g; ctx.fillRect(-60, GY, W + 120, gh + 60);
  ctx.fillStyle = rgb(pal.g1, 1, 1.3); ctx.fillRect(-60, GY, W + 120, 3);
  // 도로 점선
  const ry = GY + gh * 0.55, off = scrollX % 90;
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(0, ry - 7, W, 14);
  ctx.fillStyle = `rgba(255,230,160,${0.25 + pal.night * 0.1})`;
  for (let x = -off; x < W; x += 90) ctx.fillRect(x, ry - 1.5, 40, 3);
  // 바위/풀/기둥
  const so = scrollX, sw = 34, i0 = Math.floor(so / sw) - 1, i1 = i0 + Math.ceil(W / sw) + 2;
  for (let i = i0; i < i1; i++) {
    const x = i * sw - so, hv = hash(i * 1.7);
    if (hv < 0.25) { ctx.fillStyle = rgb(pal.g2, 0.9, 0.7); ctx.beginPath(); ctx.ellipse(x, GY + 6 + hash(i) * gh * 0.3, 6 + hv * 20, 3 + hv * 6, 0, 0, TAU); ctx.fill(); }
    else if (hv < 0.55) { ctx.strokeStyle = rgb(pal.g1, 1, 1.45); ctx.lineWidth = 1.5; ctx.beginPath(); for (let k = -2; k <= 2; k++) { ctx.moveTo(x + k * 2, GY + 2); ctx.lineTo(x + k * 3.5, GY - 4 - Math.abs(2 - Math.abs(k)) * 2 - Math.sin(T * 3 + i) * 1); } ctx.stroke(); }
    else if (hv > 0.94) { ctx.fillStyle = rgb(pal.g2, 1, 0.6); ctx.fillRect(x, GY - 16, 3, 18); ctx.fillRect(x - 5, GY - 16, 13, 2); }
  }
  // 전경 스피드 라인
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  const off2 = (scrollX * 1.4) % 140;
  for (let x = -off2; x < W; x += 140) ctx.fillRect(x, H - gh * 0.18, 70, 2);
  // 그을음 자국
  for (const d of decals) { ctx.fillStyle = 'rgba(10,6,4,0.4)'; ctx.beginPath(); ctx.ellipse(d.x, GY + 4, d.r, d.r * 0.22, 0, 0, TAU); ctx.fill(); }
}
function drawBolt(pts, a, w = 1) {
  if (a <= 0) return;
  ctx.globalAlpha = a * 0.35; ctx.strokeStyle = '#7f9cff'; ctx.lineWidth = 12 * w;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
  ctx.globalAlpha = a; ctx.strokeStyle = '#cfdcff'; ctx.lineWidth = 4 * w; ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6 * w; ctx.stroke();
  ctx.globalAlpha = 1;
}

// ================== 게임 상태 ==================
let state = 'title', T = 0, titleT = 0, overT = 0, paused = false;
let timeScale = 1, slowmo = 0, hitstop = 0, shake = 0, flash = 0, flashColor = '#fff';
let player = null, bullets = [], ebullets = [], enemies = [], parts = [], rings = [], texts = [], pickups = [], spawnQueue = [];
let score = 0, shownScore = 0, scoreBump = 0, combo = 0, comboT = 0, maxCombo = 0;
let stage = 0, stageTime = 0, clearT = -1, banner = null, boss = null, bossDeath = null, thunder = null, thunderId = 0, wreck = null, titleBolt = null;
let best = 0, newRecord = false, lastInput = 'key', isTouch = false, hpShake = 0;
try { best = +localStorage.getItem('thunderRaidBest') || 0; } catch (e) { best = 0; }

function resetGame() {

  bullets = []; ebullets = []; enemies = []; parts = []; rings = []; texts = []; pickups = []; spawnQueue = []; decals = [];
  score = 0; shownScore = 0; combo = 0; comboT = 0; maxCombo = 0; stage = 0; boss = null; bossDeath = null; thunder = null; wreck = null;

// ================== 스테이지 ==================
function q(t, f) { spawnQueue.push({ t, f }); }
const GROUPS = {
  vform() { const y = rand(GY * 0.2, GY * 0.6); for (let i = 0; i < 5; i++) { const o = i - 2; q(0, () => spawn('fighter', W + 40 + Math.abs(o) * 46, y + o * 32, { speed: 240, amp: 0, freq: 0, ph: 0 })); } },
  line() { const y = rand(GY * 0.2, GY * 0.65), amp = Math.min(70, GY * 0.12); for (let i = 0; i < 5; i++) q(i * 0.32, () => spawn('fighter', W + 40, y, { speed: 270, amp, freq: 2.2, ph: 0 })); },
  drones() { const y = rand(GY * 0.3, GY * 0.55), amp = Math.min(120, GY * 0.25); for (let i = 0; i < 6; i++) q(i * 0.26, () => spawn('drone', W + 30, y, { speed: 150, amp, freq: 2.6, ph: 0 })); },
  tanks() { const n = stage >= 3 ? 2 : 1; for (let i = 0; i < n; i++) q(i * 1.2, () => spawn('tank', W + 40, GY - 12, { mv: rand(-10, 35) })); },
  aa() { q(0, () => spawn('aa', W + 40, GY - 2)); if (stage >= 5) q(1.8, () => spawn('aa', W + 40, GY - 2)); },
  kami() { const n = 2 + Math.min(3, (stage / 2) | 0); for (let i = 0; i < n; i++) q(i * 0.55, () => spawn('kami', W + 30, rand(GY * 0.12, GY * 0.8))); },
  gunship() { q(0, () => spawn('gunship', W + 100, GY * 0.4, { ty: rand(GY * 0.25, GY * 0.5) })); },
  mixed() { GROUPS.tanks(); const y = rand(GY * 0.2, GY * 0.4); for (let i = 0; i < 4; i++) q(0.6 + i * 0.3, () => spawn('drone', W + 30, y, { speed: 170, amp: 50, freq: 3, ph: i })); },
};
function nextStage() {
  stage++; stageTime = 0; spawnQueue = []; clearT = -1;
  const ph = (stage - 1) % 4; palT = PALS[ph];
  const isBoss = stage % 4 === 0;
  boost = Math.max(boost, 1);
  banner = { t: 0, boss: isBoss, dur: isBoss ? 3.8 : 3, title: isBoss ? 'WARNING' : 'STAGE ' + stage, sub: isBoss ? '거대 공중요새가 접근 중입니다!' : PHASE_NAME[ph] };
  if (isBoss) { SFX.warn(); q(4, spawnBoss); return; }
  const pool = ['vform', 'line', 'drones', 'tanks'];
  if (stage >= 2) pool.push('aa', 'kami', 'mixed');
  if (stage >= 3) pool.push('gunship');
  const groups = Math.min(13, 5 + stage);
  let t = 2.4;
  const gap = Math.max(1.2, 2.7 - stage * 0.12);
  let hadGunship = false;
  for (let i = 0; i < groups; i++) {
    let g = pick(pool);
    if (g === 'gunship') { if (hadGunship) g = 'vform'; hadGunship = true; }
    const base = spawnQueue.length;
    GROUPS[g]();
    for (let j = base; j < spawnQueue.length; j++) spawnQueue[j].t += t;
    t += gap + rand(0, 0.7) + (g === 'gunship' ? 3 : 0);
  }
}
const ETYPES = {
  fighter: { hp: 3, r: 17, score: 120, col: '#ff5a3c' },
  drone: { hp: 2, r: 14, score: 90, col: '#b6ff3c' },
  kami: { hp: 4, r: 15, score: 200, col: '#ff3cbe' },
  tank: { hp: 10, r: 22, score: 450, col: '#a8b860', ground: true },
  aa: { hp: 9, r: 20, score: 400, col: '#ffa040', ground: true },
  gunship: { hp: 55, r: 40, score: 2500, col: '#7c9cff' },
  boss: { hp: 1, r: 150, score: 30000, col: '#ff5050' },
  bpart: { hp: 1, r: 20, score: 1500, col: '#ffb020' },

}

// ================== 발사 ==================
function eShot(x, y, a, spd, col = '#ff4d6e', r = 6, extra) {
  spd *= 1 + Math.min(0.5, (stage - 1) * 0.04);
  const b = { x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r, col, t: 0 };
  if (extra) Object.assign(b, extra);
  ebullets.push(b); return b;
}
const aimAt = (e, ox = 0, oy = 0) => Math.atan2(player.y - (e.y + oy), player.x - (e.x + ox));
function gunPos(p) { const c = Math.cos(p.rot), s = Math.sin(p.rot), gx = 40 * US, gy = 11 * US; return [p.x + gx * c - gy * s, p.y + gx * s + gy * c]; }
function playerFire() {
  const p = player, pw = p.power, [x, y] = gunPos(p), base = p.rot * 0.5;
  const col = pw >= 5 ? '#ff9bf2' : '#ffe27a';
  const S = (a, dy = 0, dmg = 1) => bullets.push({ x, y: y + dy, vx: Math.cos(base + a) * 1150, vy: Math.sin(base + a) * 1150, dmg, kind: 'shot', col });
  if (pw === 1) S(0);
  else if (pw === 2) { S(0, -4); S(0, 4); }
  else if (pw === 3) { S(0); S(-0.08); S(0.08); }
  else if (pw === 4) { S(0, -3, 1.3); S(0, 3, 1.3); S(-0.12); S(0.12); }
  else { S(0, -4, 1.4); S(0, 4, 1.4); S(-0.1); S(0.1); S(-0.2); S(0.2); }
  p.muz = 0.05;
  if (++p.shot % 2 === 0) {
    SFX.shoot();
    addPart({ kind: 'casing', x: p.x + 8 * US, y: p.y + 10 * US, vx: rand(-90, -20), vy: rand(-150, -50), life: 1.6, max: 1.6, size: 3, col: '#f0c860', rot: rand(0, TAU), vr: rand(-20, 20), g: 1100, bounce: 0.35 });
  }
}
function fireMissiles() {
  SFX.missile();
  for (const s of [-1, 1]) bullets.push({ x: player.x + 4, y: player.y + 10 * US + s * 3, vx: 140, vy: 90 + s * 40, ang: Math.atan2(90 + s * 40, 140), spd: 180, dmg: 3, kind: 'missile', col: '#ffb347', life: 3 });

function addPart(p) { if (parts.length < 2200) parts.push(p); }

  for (let i = 0; i < 18 * s; i++) { const a = rand(0, TAU), v = rand(200, 650); addPart({ kind: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.25, 0.65), max: 0.65, size: rand(1.5, 3), col: pick(['#fff3c4', '#ffd27a', col]), drag: 2.5 }); }
  for (let i = 0; i < 5 * s; i++) { const a = rand(-Math.PI, 0.3), v = rand(120, 380); addPart({ kind: 'debris', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(1.4, 2.6), max: 2.6, size: rand(3, 8), col: pick(['#2c2c36', '#46464f', col]), rot: rand(0, TAU), vr: rand(-12, 12), drag: 0.4, g: 900, bounce: 0.45, burn: Math.random() < 0.35 }); }
  for (let i = 0; i < 5 * s; i++) { const a = rand(0, TAU), v = rand(10, 60); addPart({ kind: 'smoke', x: x + rand(-8, 8) * s, y: y + rand(-8, 8) * s, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, life: rand(0.8, 1.6), max: 1.6, size: rand(8, 18) * s, drag: 1, wind: true }); }
  rings.push({ x, y, r: 6, max: 80 * s, t: 0, life: 0.45, col: '#ffcf8a', w: 7 * s });
  if (s > 1.5) rings.push({ x, y, r: 4, max: 140 * s, t: 0, life: 0.7, col, w: 3 * s });
}
function groundBlast(x, s, quiet) {

  for (let i = 0; i < 12 * s; i++) addPart({ kind: 'dust', x: x + rand(-20, 20) * s, y: y - rand(0, 12), vx: rand(-140, 140) * s, vy: -rand(10, 80) * s, life: rand(1.2, 2.4), max: 2.4, size: rand(10, 22) * s, drag: 1.6, wind: true });
  for (let i = 0; i < 7 * s; i++) addPart({ kind: 'debris', x: x + rand(-8, 8), y: y - 6, vx: rand(-220, 220), vy: -rand(220, 560), life: rand(1.2, 2.2), max: 2.2, size: rand(2.5, 6), col: pick(['#5a4632', '#3a2c20', '#6e5a40']), rot: rand(0, TAU), vr: rand(-14, 14), g: 1000, bounce: 0.3 });
  for (let i = 0; i < 10 * s; i++) { const a = rand(-Math.PI, 0), v = rand(200, 520); addPart({ kind: 'spark', x, y: y - 4, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.2, 0.5), max: 0.5, size: 2, col: '#ffe0a0', drag: 2.5 }); }
  rings.push({ x, y, r: 4, max: 110 * s, t: 0, life: 0.5, col: '#ffd8a0', w: 6 * s, flat: true });
  decals.push({ x, r: 24 * s });

function sparkHit(x, y, col) {
  for (let i = 0; i < 4; i++) { const a = Math.PI + rand(-0.8, 0.8); addPart({ kind: 'spark', x, y, vx: Math.cos(a) * rand(150, 380), vy: Math.sin(a) * rand(150, 380), life: 0.2, max: 0.2, size: 1.8, col, drag: 3 }); }

function popText(x, y, txt, col = '#fff', size = 18, life = 1) { texts.push({ x, y, txt, col, size, t: 0, life }); }

// ================== 데미지 / 처치 ==================
function hits(e, x, y, rad) {
  if (e.type === 'boss') { const dx = (x - e.x) / (e.rx * e.sc + rad), dy = (y - e.y) / (e.ry * e.sc + rad); return dx * dx + dy * dy < 1; }
  const dx = x - e.x, dy = y - e.y, rr = e.r + rad; return dx * dx + dy * dy < rr * rr;
}
function damage(e, d) {
  if (e.dead) return;
  if (e.type === 'boss' || e.type === 'bpart') {
    const b = e.type === 'boss' ? e : e.parent;
    if (b.phase === 0 || b.dying) return;
    if (e.type === 'boss' && b.parts.some(p => !p.dead)) d *= 0.35;
  }
  e.hp -= d; e.flash = 0.06;
  if (e.hp <= 0) { e.dead = true; kill(e); }
}
const ESCALE = { fighter: 1, drone: 0.9, kami: 1.1, tank: 1.6, aa: 1.5, gunship: 2.4 };
const EDROP = { fighter: 0.06, drone: 0.05, kami: 0.08, tank: 0.3, aa: 0.3, gunship: 1 };
function kill(e) {
  combo++; comboT = 2.6; maxCombo = Math.max(maxCombo, combo);
  const mult = Math.min(5, 1 + Math.floor(combo / 10) * 0.5), pts = Math.round(e.score * mult);
  addScore(pts);
  if (combo % 10 === 0) { popText(W / 2, GY * 0.3, combo + ' COMBO!', '#ffe14d', Math.min(42, W / 10), 1.3); flash = Math.max(flash, 0.2); flashColor = '#ffe14d'; }
  if (e.type === 'boss') { startBossDeath(e, pts); return; }
  popText(e.x, e.y - 10, '+' + pts, mult > 1 ? '#ffe14d' : '#fff', mult > 1 ? 20 : 16);
  if (e.type === 'bpart') {
    explode(e.x, e.y, 1.7, '#ffb020'); SFX.boom(); SFX.ground();
    shake = Math.min(40, shake + 12); hitstop = 0.06; flash = Math.max(flash, 0.3); flashColor = '#ffb070';
    const b = e.parent;
    if (b.parts.every(p => p.dead)) { popText(b.x, b.y - 90 * b.sc, 'CORE EXPOSED!', '#ff6060', Math.min(30, W / 13), 1.8); rings.push({ x: b.x, y: b.y, r: 10, max: 260 * b.sc, t: 0, life: 0.6, col: '#ff6060', w: 10 }); }
    else popText(e.x, e.y - 34, 'PART DESTROYED', '#ffb020', 15, 1.2);
    if (Math.random() < 0.6) dropPickup(e.x, e.y);
    return;
  }
  const s = ESCALE[e.type] || 1;
  if (e.ground) { groundBlast(e.x, s); explode(e.x, e.y - 10, s * 0.6, e.col); addPart({ kind: 'debris', x: e.x, y: e.y - 16, vx: rand(-80, 80), vy: -rand(450, 650), life: 2.6, max: 2.6, size: 13, col: '#2a2a22', rot: 0, vr: rand(-10, 10), g: 1000, bounce: 0.35, burn: true }); }
  else { explode(e.x, e.y, s, e.col); SFX.boom(); }
  shake = Math.min(40, shake + s * 4);
  if (s >= 1.5) { hitstop = 0.06; flash = Math.max(flash, 0.22); flashColor = '#ffb070'; }
  if (e.type === 'gunship') { dropPickup(e.x, e.y, 'P'); dropPickup(e.x + 20, e.y - 10); hitstop = 0.1; }
  else if (Math.random() < EDROP[e.type]) dropPickup(e.x, e.y);
}
function startBossDeath(e, pts) {
  bossDeath = { e, t: 0, nx: 0 }; e.dying = true; e.vy = 0; e.rot = 0; boss = null;
  for (const p of e.parts) if (!p.dead) p.dead = true;
  slowmo = 1.8; SFX.big(); flash = 0.6; flashColor = '#fff'; shake = 30;
  ebullets.forEach(b => sparkHit(b.x, b.y, b.col)); ebullets = [];
  popText(e.x, e.y - 40, '+' + pts, '#ffe14d', 34, 2);
}
function dropPickup(x, y, type) {
  if (!type) { const r = Math.random(); type = r < 0.5 ? 'P' : r < 0.8 ? 'S' : 'T'; }
  pickups.push({ x, y, type, t: 0, vy: -120 });
}
function hurtPlayer() {
  const p = player;
  if (p.inv > 0 || !p.alive) return;
  p.hp--; p.inv = 1.8; hpShake = 1;
  shake = 26; flash = 0.55; flashColor = '#ff2040'; hitstop = 0.08; SFX.hurt();
  explode(p.x, p.y, 0.8, '#5fe8ff');
  combo = 0;
  if (p.power > 1) { p.power--; popText(p.x, p.y - 40, 'POWER DOWN', '#ff6080', 16); }
  if (p.hp <= 0) {
    p.alive = false; state = 'dying'; overT = 0; slowmo = 2.2;
    explode(p.x, p.y, 2, '#5fe8ff'); SFX.big(); shake = 40; flash = 1; flashColor = '#fff';
    wreck = { x: p.x, y: p.y, vx: 80, vy: -160, rot: p.rot, vr: rand(4, 6), rotor: p.rotor };
    rings.push({ x: p.x, y: p.y, r: 0, max: Math.max(W, H), t: 0, life: 1.4, col: '#7ff', w: 20 });
    if (score > best) { best = score; newRecord = true; try { localStorage.setItem('thunderRaidBest', best); } catch (e) { } }
  }
}
function useSpecial() {
  const p = player;
  if (state !== 'play' || !p || !p.alive || p.specials <= 0 || thunder) return;
  p.specials--; thunderId++; SFX.thunder();
  const targets = enemies.filter(e => !e.dead && e.x > -20 && e.x < W + 20 && e.y < H).slice(0, 16);
  const bolts = [];
  for (const e of targets) bolts.push({ x1: e.x + rand(-80, 80), y1: -20, x2: e.x, y2: e.y, pts: null });
  for (let i = 0; i < 4; i++) { const x = rand(W * 0.1, W * 0.95); bolts.push({ x1: x + rand(-60, 60), y1: -20, x2: x, y2: GY, pts: null, gnd: true }); }
  for (const b of bolts) b.pts = boltPts(b.x1, b.y1, b.x2, b.y2, 70);
  thunder = { t: 0, bolts, regen: 0 };
  for (const e of targets) { damage(e, e.type === 'boss' ? 45 : e.type === 'bpart' ? 25 : 40); explode(e.x, e.y, 0.6, '#9db8ff'); }
  for (const b of bolts) if (b.gnd) groundBlast(b.x2, 0.9, true);
  for (const b of ebullets) { sparkHit(b.x, b.y, b.col); addScore(10); }
  ebullets = [];
  flash = 0.95; flashColor = '#e0e8ff'; shake = 34; slowmo = 0.5;
  p.inv = Math.max(p.inv, 2);
  rings.push({ x: p.x, y: p.y, r: 0, max: Math.hypot(W, H) * 1.1, t: 0, life: 1.0, col: '#9db8ff', w: 40 });
  rings.push({ x: p.x, y: p.y, r: 0, max: Math.hypot(W, H) * 0.7, t: 0, life: 1.2, col: '#fff', w: 12 });
  popText(p.x, p.y - 60, 'THUNDER STRIKE!', '#cfdcff', Math.min(32, W / 13), 1.2);
}

// ================== 입력 ==================
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) { lastInput = 'key'; e.preventDefault(); }
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (state === 'play' && e.code === 'Space') { if (paused) paused = false; else useSpecial(); }
    else if (state === 'title' || (state === 'over' && overT > 1.2)) startGame();
  }
  if (e.code === 'KeyX' || e.code === 'KeyB') useSpecial();
  if (e.code === 'KeyM') muted = !muted;
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') paused = !paused;
});
addEventListener('keyup', e => { keys[e.code] = false; });
const pointer = { active: false, id: -1, ox: 0, oy: 0 };
const specBtn = () => ({ x: W - 62, y: H - 70, r: 36 });
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (e.pointerType === 'touch') isTouch = true;
  if (paused) { paused = false; return; }
  if (state === 'title' || (state === 'over' && overT > 1.2)) { if (e.button !== 2) startGame(); return; }
  if (state !== 'play') return;
  if (e.button === 2) return;
  const b = specBtn();
  if (isTouch && Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r + 10) { useSpecial(); return; }
  pointer.active = true; pointer.id = e.pointerId;
  pointer.ox = player.x - e.clientX; pointer.oy = player.y - e.clientY;
  lastInput = e.pointerType === 'mouse' ? 'mouse' : 'touch';
  if (lastInput === 'mouse') { pointer.ox = 0; pointer.oy = 0; player.tx = e.clientX; player.ty = e.clientY; }
});
cv.addEventListener('pointermove', e => {
  if (!player) return;
  if (e.pointerType === 'mouse') { lastInput = 'mouse'; player.tx = e.clientX; player.ty = e.clientY; return; }

    const b = specBtn(), ready = p.specials > 0 && !thunder;
    ctx.globalAlpha = ready ? 0.9 : 0.3;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fillStyle = 'rgba(30,40,110,0.55)'; ctx.fill();
    ctx.strokeStyle = PCOL.T; ctx.lineWidth = 3; ctx.stroke();
    if (ready) { ctx.globalAlpha = 0.5 + 0.4 * Math.sin(T * 5); ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, 0, TAU); ctx.lineWidth = 1.5; ctx.stroke(); ctx.globalAlpha = 0.9; }
    ctx.fillStyle = '#fff'; poly([[b.x + 3, b.y - 18], [b.x - 9, b.y + 2], [b.x - 1, b.y + 2], [b.x - 5, b.y + 18], [b.x + 9, b.y - 4], [b.x + 1, b.y - 4]]); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (stage === 1 && stageTime < 9) {
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.font = `600 12px ${KFONT}`; ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText('이동: 마우스 / 방향키·WASD · 썬더: SPACE / 우클릭 · 일시정지 P · 소리 M', W - 16, H - 8);
  }
}
function drawBanner() {
  if (!banner) return;
  const t = banner.t, D = banner.dur, inK = outBack(clamp(t / 0.45, 0, 1)), outK = clamp((t - (D - 0.6)) / 0.5, 0, 1);
  const a = clamp(t / 0.2, 0, 1) * (1 - outK), cy = GY * 0.36;
  ctx.save(); ctx.globalAlpha = a;
  if (banner.boss) {
    const blink = Math.sin(t * 14) > 0 ? 1 : 0.55;
    ctx.fillStyle = `rgba(255,20,40,${0.2 * blink})`; ctx.fillRect(0, 0, W, H);
    for (const yy of [cy - 72, cy + 58]) {
      ctx.save(); ctx.beginPath(); ctx.rect(0, yy, W, 16); ctx.clip();
      ctx.fillStyle = 'rgba(255,190,30,0.9)'; ctx.fillRect(0, yy, W, 16);
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      const off = (t * 160) % 40;
      for (let x = -40 + (yy > cy ? -off : off); x < W + 40; x += 40) { ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + 20, yy); ctx.lineTo(x + 4, yy + 16); ctx.lineTo(x - 16, yy + 16); ctx.closePath(); ctx.fill(); }
      ctx.restore();
    }
  } else {
    const lw = W * outCubic(clamp(t / 0.5, 0, 1));
    const g = ctx.createLinearGradient(W / 2 - lw / 2, 0, W / 2 + lw / 2, 0);
    g.addColorStop(0, 'rgba(255,220,120,0)'); g.addColorStop(0.5, 'rgba(255,220,120,0.95)'); g.addColorStop(1, 'rgba(255,220,120,0)');
    ctx.fillStyle = g; ctx.fillRect(W / 2 - lw / 2, cy - 42, lw, 2); ctx.fillRect(W / 2 - lw / 2, cy + 44, lw, 2);
  }
  ctx.translate(W / 2 - outK * W * 0.4, cy);
  const sc = (banner.boss ? 1 : lerp(2.4, 1, inK)) * (1 + outK * 0.3);
  ctx.scale(sc, sc * (banner.boss ? inK : 1));
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const fs = Math.min(64, W / 7);
  ctx.font = `900 ${fs}px ${FONT}`;
  ctx.globalCompositeOperation = 'lighter';
  const jit = (1 - clamp(t / 0.6, 0, 1)) * 10 + 1.5;
  ctx.fillStyle = 'rgba(255,0,80,0.7)'; ctx.fillText(banner.title, -jit, 0);
  ctx.fillStyle = 'rgba(0,200,255,0.7)'; ctx.fillText(banner.title, jit, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.strokeText(banner.title, 0, 0);
  ctx.fillStyle = banner.boss ? '#ffe0e0' : '#fff'; ctx.fillText(banner.title, 0, 0);
  ctx.font = `700 ${Math.min(20, W / 20)}px ${KFONT}`; ctx.fillStyle = banner.boss ? '#ffd0d0' : '#ffe9b0';
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 3; ctx.strokeText(banner.sub, 0, fs * 0.75); ctx.fillText(banner.sub, 0, fs * 0.75);
  ctx.restore(); ctx.globalAlpha = 1;
}
function drawTitle() {
  const t = titleT;
  if (titleBolt) lighter(() => drawBolt(titleBolt.pts, 1 - titleBolt.t / 0.45, 1));
  const hx = W * 0.3 + Math.sin(t * 0.8) * 30, hy = GY * 0.62 + Math.sin(t * 1.6) * 10;
  drawParts(0);
  drawHeli(hx, hy, Math.cos(t * 1.6) * 0.08, 1.5 * US, 1, t * 38, false, 0);
  drawParts(1);
  const title = 'THUNDER RAID', fs = Math.min(84, W / 8.2);
  ctx.font = `900 ${fs}px ${FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const tw = ctx.measureText(title).width;
  let x = W / 2 - tw / 2; const cy = GY * 0.26;
  for (let i = 0; i < title.length; i++) {
    const ch = title[i], w = ctx.measureText(ch).width;
    const appear = clamp((t - i * 0.06) / 0.5, 0, 1), y = cy + Math.sin(t * 3 + i * 0.5) * 5 - (1 - outBack(appear)) * 90;
    ctx.globalAlpha = appear;
    const g = ctx.createLinearGradient(0, y - fs / 2, 0, y + fs / 2);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#ffe27a'); g.addColorStop(1, '#ff7a2a');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(80,120,255,0.45)'; ctx.fillText(ch, x - 3, y + 3); ctx.fillStyle = 'rgba(255,60,120,0.4)'; ctx.fillText(ch, x + 3, y - 2);
    ctx.globalCompositeOperation = 'source-over'; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(20,10,30,0.6)'; ctx.strokeText(ch, x, y); ctx.fillStyle = g; ctx.fillText(ch, x, y);
    x += w;
  }
  ctx.globalAlpha = 1;
  const sw = ((t * 0.5) % 1.6) - 0.3;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const sx = W / 2 - tw / 2 + sw * tw;
  const sg = ctx.createLinearGradient(sx - 40, 0, sx + 40, 0); sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,0.35)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sg; ctx.fillRect(sx - 40, cy - fs * 0.6, 80, fs * 1.2); ctx.restore();
  ctx.textAlign = 'center';
  ctx.font = `700 ${Math.min(19, W / 21)}px ${KFONT}`; ctx.fillStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.strokeText('폭풍을 뚫고 적의 공중요새를 격파하라', W / 2, cy + fs * 0.8); ctx.fillText('폭풍을 뚫고 적의 공중요새를 격파하라', W / 2, cy + fs * 0.8);
  const blink = 0.5 + 0.5 * Math.sin(t * 4);
  ctx.font = `900 ${Math.min(22, W / 18)}px ${FONT}`; ctx.fillStyle = `rgba(255,225,77,${0.4 + blink * 0.6})`;
  ctx.fillText('CLICK / TAP / SPACE', W / 2, cy + fs * 1.55);
  if (best > 0) { ctx.font = `700 13px ${FONT}`; ctx.fillStyle = 'rgba(255,225,77,0.9)'; ctx.fillText('BEST ' + best, W / 2, cy + fs * 1.55 + 30); }
  ctx.font = `600 ${Math.min(13, W / 30)}px ${KFONT}`; ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText('이동: 마우스 · 방향키/WASD · 터치 드래그   |   기관포·폭탄·미사일 자동 발사', W / 2, H - 42);
  ctx.fillText('썬더 스트라이크(전체 공격): SPACE · 우클릭 · 터치 버튼   |   일시정지 P · 소리 M', W / 2, H - 22);
}
function drawOver() {
  const t = overT;
  ctx.fillStyle = `rgba(5,3,15,${Math.min(0.68, t * 0.8)})`; ctx.fillRect(0, 0, W, H);
  const txt = 'GAME OVER', fs = Math.min(72, W / 8);
  ctx.font = `900 ${fs}px ${FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const tw = ctx.measureText(txt).width; let x = W / 2 - tw / 2; const cy = H * 0.3;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i], w = ctx.measureText(ch).width, k = clamp((t - i * 0.07) / 0.6, 0, 1);
    const y = cy - (1 - outBack(k)) * 120;
    ctx.globalAlpha = k;
    ctx.fillStyle = '#ff5a2a'; ctx.fillText(ch, x + 3, y + 3);
    ctx.fillStyle = '#fff'; ctx.fillText(ch, x, y);
    x += w;
  }
  ctx.globalAlpha = clamp((t - 0.8) / 0.4, 0, 1);
  ctx.textAlign = 'center';
  const cnt = Math.round(score * outCubic(clamp((t - 0.8) / 1.2, 0, 1)));
  ctx.font = `900 ${Math.min(40, W / 12)}px ${FONT}`; ctx.fillStyle = '#ffe14d'; ctx.fillText(cnt, W / 2, cy + fs * 1.1);
  ctx.font = `700 ${Math.min(14, W / 28)}px ${FONT}`; ctx.fillStyle = 'rgba(220,230,255,0.85)';
  ctx.fillText(`STAGE ${stage}   ·   MAX COMBO ${maxCombo}   ·   BEST ${best}`, W / 2, cy + fs * 1.1 + 40);
  if (newRecord && t > 2) { const s = 1 + Math.sin(t * 8) * 0.08; ctx.save(); ctx.translate(W / 2, cy + fs * 1.1 + 76); ctx.scale(s, s); ctx.font = `900 22px ${FONT}`; ctx.fillStyle = '#ff9b5a'; ctx.fillText('NEW RECORD!', 0, 0); ctx.restore(); }
  if (t > 1.2) { ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 4); ctx.font = `700 16px ${KFONT}`; ctx.fillStyle = '#fff'; ctx.fillText('클릭 / 탭 / SPACE 로 재출격', W / 2, H * 0.72); }
  ctx.globalAlpha = 1;
}

// ================== 렌더 ==================
function render() {
  ctx.save();
  if (shake > 0.5) ctx.translate(rand(-1, 1) * shake, rand(-1, 1) * shake);
  drawSky();
  drawBackClouds(false);
  drawLand();
  drawGround();
  if (state === 'title') { drawBackClouds(true); drawTitle(); ctx.restore(); drawOverlay(); return; }
  for (const e of enemies) if (e.ground) drawEnemy(e);
  drawParts(0);
  drawPickups();
  for (const e of enemies) if (!e.ground && e.type !== 'boss' && e.type !== 'bpart') drawEnemy(e);
  if (boss) drawBoss(boss, false);
  if (bossDeath) drawBoss(bossDeath.e, true);
  drawBullets();
  if (player.alive) {
    const blink = player.inv > 0 ? (Math.sin(T * 40) > 0 ? 0.35 : 1) : 1;
    drawHeli(player.x, player.y, player.rot, US, blink, player.rotor, false, player.muz);
    if (player.inv > 0 && state === 'play') lighter(() => { ctx.strokeStyle = `rgba(150,200,255,${0.35 * Math.min(1, player.inv)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(player.x, player.y, 46 * US + Math.sin(T * 10) * 3, 0, TAU); ctx.stroke(); });
    lighter(() => drawGlow(player.x, player.y, 6, '#ff60a0', 0.9));
  }
  if (wreck) drawHeli(wreck.x, wreck.y, wreck.rot, US, 1, wreck.rotor, true, 0);
  drawParts(1);
  drawEBullets();
  drawThunder();
  drawBackClouds(true);
  drawTexts();
  ctx.restore();
  if (state === 'play' || state === 'dying') drawHUD();
  drawBanner();
  if (state === 'over') drawOver();
  drawOverlay();
}
function drawOverlay() {
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  if (flash > 0) { ctx.globalAlpha = Math.min(1, flash) * 0.8; ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (player && player.alive && player.hp <= 2 && state === 'play') {
    const a = 0.25 + 0.15 * Math.sin(T * 6);
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(255,0,40,0)'); g.addColorStop(1, `rgba(255,0,40,${a})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 ${Math.min(48, W / 8)}px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.font = `600 14px ${KFONT}`; ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillText('P 키 또는 클릭/탭으로 계속', W / 2, H / 2 + 44);
  }
  if (muted) { ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.font = `700 11px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillText('MUTED', W - 16, 74); }
}

// ================== 루프 ==================
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (!paused) {
    T += rdt;
    if (hitstop > 0) { hitstop -= rdt; shake *= Math.exp(-7 * rdt); }
    else {
      slowmo = Math.max(0, slowmo - rdt);
      timeScale = lerp(timeScale, slowmo > 0 ? 0.3 : 1, 1 - Math.exp(-8 * rdt));
      update(rdt * timeScale, rdt);
    }
  }
  render();
  requestAnimationFrame(frame);
}
resize(); addEventListener('resize', resize);
resetGame();
requestAnimationFrame(frame);
</script>
