<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sky Striker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#05030f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// ================== 기본 셋업 ==================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, vignette = null;
const FONT = '"Orbitron","Segoe UI","Malgun Gothic",sans-serif';
const KFONT = '"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif';
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[(Math.random() * arr.length) | 0];
const outBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const outCubic = t => 1 - Math.pow(1 - t, 3);

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = (W * DPR) | 0; cv.height = (H * DPR) | 0;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.65)');
  initStars();
}

// ================== 사운드 (WebAudio 합성) ==================
let AC = null, master = null, noiseBuf = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f1, f2, dur, type = 'square', vol = 0.1, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 1000) {
  if (!AC || muted) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
let lastHitSfx = 0, lastBoomSfx = 0;
const SFX = {
  shoot: () => tone(1200, 500, 0.05, 'square', 0.018),
  hit: () => { if (T - lastHitSfx < 0.04) return; lastHitSfx = T; tone(320, 140, 0.05, 'sawtooth', 0.03); },
  boom: () => { if (T - lastBoomSfx < 0.03) return; lastBoomSfx = T; noise(0.5, 0.3, 1800); tone(170, 40, 0.35, 'sine', 0.22); },
  big: () => { noise(1.6, 0.5, 2600); tone(120, 22, 1.4, 'sine', 0.45); },
  power: () => { tone(500, 1500, 0.2, 'triangle', 0.12); tone(800, 2200, 0.2, 'triangle', 0.1, 0.08); },
  hurt: () => { noise(0.35, 0.45, 900); tone(220, 50, 0.35, 'sawtooth', 0.16); },
  bomb: () => { noise(1.6, 0.55, 4000); tone(70, 25, 1.5, 'sine', 0.55); },
  warn: () => { for (let i = 0; i < 3; i++) { tone(520, 520, 0.22, 'square', 0.07, i * 0.5); tone(390, 390, 0.22, 'square', 0.07, i * 0.5 + 0.25); } },
  start: () => { tone(300, 900, 0.3, 'sawtooth', 0.08); tone(600, 1800, 0.35, 'triangle', 0.08, 0.1); },
  missile: () => tone(200, 600, 0.12, 'triangle', 0.03),
};

// ================== 글로우 스프라이트 캐시 ==================
const glowCache = {};
function glowSprite(color) {
  if (glowCache[color]) return glowCache[color];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.22, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return (glowCache[color] = c);
}
function drawGlow(x, y, r, color, a = 1) {
  if (r <= 0 || a <= 0) return;
  ctx.globalAlpha = Math.min(1, a);
  ctx.drawImage(glowSprite(color), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
}
function polyM(pts) { // 좌우 대칭 다각형
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  for (let i = pts.length - 1; i >= 0; i--) ctx.lineTo(-pts[i][0], pts[i][1]);
  ctx.closePath();
}

// ================== 배경 ==================
let stars = [], nebulae = [], planet = null, bgHue = 250, bgTarget = 250, warp = 0;
function initStars() {
  stars = [];
  const n = Math.floor(W * H / 2200);
  for (let i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, z: Math.random() });
  nebulae = [];
  for (let i = 0; i < 4; i++) nebulae.push({ x: Math.random() * W, y: Math.random() * H, r: rand(200, 420), h: rand(0, 360), s: rand(8, 20) });
  if (!planet) newPlanet(true);
}
function newPlanet(first) {
  const r = rand(50, 130);
  planet = { x: rand(r, W - r), y: first ? rand(H * 0.1, H * 0.5) : -r * 2.2, r, h: rand(0, 360), ring: Math.random() < 0.6, tilt: rand(-0.5, 0.5) };
}
function updateBg(dt, rdt) {
  bgHue = lerp(bgHue, bgTarget, 1 - Math.exp(-0.6 * rdt));
  warp = Math.max(0, warp - rdt * 0.5);
  const sp = 1 + warp * 7;
  for (const s of stars) {
    s.y += (25 + s.z * 380) * sp * dt;
    if (s.y > H + 20) { s.y -= H + 40; s.x = Math.random() * W; }
  }
  for (const n of nebulae) { n.y += n.s * sp * dt; if (n.y - n.r > H) { n.y = -n.r; n.x = Math.random() * W; n.h = bgHue + rand(-80, 80); } }
  planet.y += 14 * sp * dt;
  if (planet.y - planet.r * 2 > H) newPlanet(false);
}
function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `hsl(${bgHue},60%,6%)`);
  g.addColorStop(0.6, `hsl(${bgHue + 30},55%,9%)`);
  g.addColorStop(1, `hsl(${bgHue + 60},60%,13%)`);
  ctx.fillStyle = g; ctx.fillRect(-50, -50, W + 100, H + 100);
  // 성운
  ctx.globalCompositeOperation = 'lighter';
  for (const n of nebulae) {
    const ng = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    ng.addColorStop(0, `hsla(${n.h},80%,45%,0.13)`);
    ng.addColorStop(1, `hsla(${n.h},80%,45%,0)`);
    ctx.fillStyle = ng; ctx.fillRect(n.x - n.r, n.y - n.r, n.r * 2, n.r * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
  // 행성
  const p = planet;
  ctx.save(); ctx.translate(p.x, p.y);
  if (p.ring) { ctx.save(); ctx.rotate(p.tilt); ctx.scale(1, 0.25); ctx.strokeStyle = `hsla(${p.h + 40},50%,70%,0.35)`; ctx.lineWidth = p.r * 0.5; ctx.beginPath(); ctx.arc(0, 0, p.r * 1.7, Math.PI, TAU); ctx.stroke(); ctx.restore(); }
  const pg = ctx.createRadialGradient(-p.r * 0.4, -p.r * 0.4, p.r * 0.1, 0, 0, p.r);
  pg.addColorStop(0, `hsl(${p.h},55%,55%)`); pg.addColorStop(0.7, `hsl(${p.h + 20},50%,25%)`); pg.addColorStop(1, `hsl(${p.h + 30},50%,8%)`);
  ctx.fillStyle = pg; ctx.globalAlpha = 0.75; ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.fill();
  ctx.globalAlpha = 0.18; ctx.strokeStyle = `hsl(${p.h},70%,70%)`; ctx.lineWidth = 3; ctx.stroke(); ctx.globalAlpha = 1;
  if (p.ring) { ctx.save(); ctx.rotate(p.tilt); ctx.scale(1, 0.25); ctx.strokeStyle = `hsla(${p.h + 40},50%,70%,0.45)`; ctx.lineWidth = p.r * 0.5; ctx.beginPath(); ctx.arc(0, 0, p.r * 1.7, 0, Math.PI); ctx.stroke(); ctx.restore(); }
  ctx.restore();
  // 별 (워프 시 선으로 늘어남)
  const sp = 1 + warp * 7;
  ctx.globalCompositeOperation = 'lighter';
  for (const s of stars) {
    const a = 0.25 + s.z * 0.75, len = (2 + s.z * 10) * sp;
    ctx.strokeStyle = s.z > 0.85 ? `rgba(180,220,255,${a})` : `rgba(255,255,255,${a})`;
    ctx.lineWidth = 0.6 + s.z * 1.6;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, s.y - len); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ================== 게임 상태 ==================
let state = 'title', T = 0, titleT = 0, overT = 0, paused = false;
let timeScale = 1, slowmo = 0, hitstop = 0, shake = 0, flash = 0, flashColor = '#fff';
let player, bullets, ebullets, enemies, parts, rings, texts, pickups, spawnQueue;
let score = 0, shownScore = 0, scoreBump = 0, combo = 0, comboT = 0, maxCombo = 0;
let wave = 0, waveTime = 0, waveClearT = -1, banner = null, boss = null, bossDeath = null, bombWave = null, bombId = 0;
let best = 0, newRecord = false, lastInput = 'key', isTouch = false, hpShake = 0;
try { best = +localStorage.getItem('skyStrikerBest') || 0; } catch (e) { best = 0; }

function resetGame() {
  player = { x: W / 2, y: H * 0.8, vx: 0, vy: 0, tilt: 0, hp: 5, maxHp: 5, power: 1, bombs: 3, inv: 2.5, fireT: 0, missT: 0, alive: true, shot: 0, tx: W / 2, ty: H * 0.8 };
  bullets = []; ebullets = []; enemies = []; parts = []; rings = []; texts = []; pickups = []; spawnQueue = [];
  score = 0; shownScore = 0; combo = 0; comboT = 0; maxCombo = 0; wave = 0; boss = null; bossDeath = null; bombWave = null;
  waveClearT = -1; newRecord = false; slowmo = 0; timeScale = 1;
}
function startGame() {
  initAudio(); SFX.start();
  resetGame(); state = 'play'; warp = 1.5; flash = 0.6; flashColor = '#bfe8ff';
  // 화면 아래에서 날아 들어오는 연출
  player.y = H + 60; player.ty = H * 0.78;
  nextWave();
}

// ================== 웨이브 ==================
function q(t, f) { spawnQueue.push({ t, f }); }
const GROUPS = {
  vee() { const cx = rand(W * 0.25, W * 0.75); for (let i = 0; i < 5; i++) { const o = i - 2; q(i * 0.1, () => spawn('drone', cx + o * 42, -30 - Math.abs(o) * 34, { speed: 150, amp: 0, freq: 0, ph: 0 })); } },
  snake() { const cx = rand(W * 0.25, W * 0.75); for (let i = 0; i < 6; i++) q(i * 0.22, () => spawn('drone', cx, -30, { speed: 170, amp: Math.min(130, W * 0.22), freq: 2.4, ph: 0 })); },
  pincer() { for (let i = 0; i < 4; i++) { q(i * 0.25, () => spawn('drone', 40, -30, { speed: 190, amp: 40, freq: 3, ph: i, drift: 90 })); q(i * 0.25, () => spawn('drone', W - 40, -30, { speed: 190, amp: 40, freq: 3, ph: i, drift: -90 })); } },
  divers() { const n = 2 + Math.min(3, (wave / 3) | 0); for (let i = 0; i < n; i++) { const x = rand(60, W - 60); q(i * 0.35, () => spawn('diver', x, -30, { ty: rand(70, H * 0.35) })); } },
  tank() { q(0, () => spawn('tank', rand(W * 0.2, W * 0.8), -50, { ty: rand(90, 170) })); },
  spinner() { for (let i = 0; i < 2; i++) q(i * 0.6, () => spawn('spinner', rand(60, W - 60), -30, { speed: 85 })); },
};
function nextWave() {
  wave++; waveTime = 0; spawnQueue = []; waveClearT = -1;
  bgTarget = 250 + wave * 37;
  const isBoss = wave % 5 === 0;
  banner = { t: 0, boss: isBoss, title: isBoss ? 'WARNING' : 'WAVE ' + wave, sub: isBoss ? '거대 전함이 접근 중입니다' : pick(['적 편대 출현!', '전투 준비!', '하늘을 지켜라!', '적기 다수 접근!']) };
  warp = Math.max(warp, 1);
  if (isBoss) { SFX.warn(); q(3, spawnBoss); return; }
  const pool = ['vee', 'snake', 'divers'];
  if (wave >= 2) pool.push('pincer', 'spinner');
  if (wave >= 3) pool.push('tank');
  const groups = 3 + wave;
  let t = 2.2;
  const gap = Math.max(1.0, 2.4 - wave * 0.1);
  for (let i = 0; i < groups; i++) {
    const g = pick(pool), base = spawnQueue.length;
    GROUPS[g]();
    for (let j = base; j < spawnQueue.length; j++) spawnQueue[j].t += t;
    t += gap + rand(0, 0.6);
  }
}
const ETYPES = {
  drone: { hp: 2, r: 16, score: 100, col: '#ff3b5c' },
  diver: { hp: 4, r: 16, score: 150, col: '#b04dff' },
  tank: { hp: 18, r: 30, score: 600, col: '#ff8a2a' },
  spinner: { hp: 7, r: 20, score: 300, col: '#c6ff3d' },
  boss: { hp: 1, r: 70, score: 10000, col: '#ff4fd8' },
};
function spawn(type, x, y, o = {}) {
  const e = Object.assign({ type, x, y, bx: x, t: 0, flash: 0, fireT: rand(1, 2.5), rot: Math.PI / 2, vx: 0, vy: 0, phase: 0, spawnT: 0, drift: 0, aimA: Math.PI / 2 }, ETYPES[type], o);
  e.hp = Math.ceil(e.hp * (1 + (wave - 1) * 0.12)); e.maxHp = e.hp;
  enemies.push(e); return e;
}
function spawnBoss() {
  const lvl = wave / 5;
  const e = spawn('boss', W / 2, -170, { r: Math.min(70, W * 0.14), ty: Math.min(170, H * 0.22), atk: -1, atkT: 1.5, atkDur: 0, sub: 0, score: 10000 * lvl });
  e.hp = e.maxHp = 380 + lvl * 260; e.hpShow = e.hp;
  boss = e; shake = 20; warp = 2;
}

// ================== 발사 ==================
function eShot(x, y, a, spd, col = '#ff3d6e', r = 6) {
  spd *= 1 + Math.min(0.5, wave * 0.025);
  ebullets.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r, col, t: 0 });
}
const aimAt = e => Math.atan2(player.y - e.y, player.x - e.x);
function playerFire() {
  const p = player, pw = p.power, x = p.x, y = p.y - 28;
  const L = (dx, a, dmg = 1) => bullets.push({ x: x + dx, y, vx: Math.sin(a) * 1150, vy: -Math.cos(a) * 1150, dmg, kind: 'laser', col: pw >= 5 ? '#ff7bf2' : '#5fe8ff' });
  if (pw === 1) { L(-6, 0); L(6, 0); }
  else if (pw === 2) { L(-10, 0); L(0, 0); L(10, 0); }
  else if (pw === 3) { L(-8, 0); L(8, 0); L(0, 0); L(-16, -0.13); L(16, 0.13); }
  else { L(-8, 0, 1.2); L(8, 0, 1.2); L(0, 0, 1.2); L(-16, -0.12); L(16, 0.12); if (pw >= 5) { L(-22, -0.26); L(22, 0.26); } }
  parts.push({ kind: 'glow', x, y: y + 4, vx: 0, vy: 0, life: 0.06, max: 0.06, size: 22, col: '#7ff' });
  if (++p.shot % 2 === 0) SFX.shoot();
}
function fireMissiles() {
  SFX.missile();
  for (const s of [-1, 1]) bullets.push({ x: player.x + s * 22, y: player.y + 6, vx: s * 260, vy: 80, ang: Math.atan2(80, s * 260), spd: 260, dmg: 3, kind: 'missile', col: '#ffb347', life: 3 });
}

// ================== 이펙트 ==================
function addPart(p) { if (parts.length < 1800) parts.push(p); }
function explode(x, y, s, col) {
  addPart({ kind: 'glow', x, y, vx: 0, vy: 0, life: 0.22, max: 0.22, size: 70 * s, col: '#fff' });
  for (let i = 0; i < 12 * s; i++) { const a = rand(0, TAU), v = rand(20, 160) * s; addPart({ kind: 'fire', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.35, 0.8), max: 0.8, size: rand(14, 30) * Math.sqrt(s), col: pick(['#ffd27a', '#ff8a3d', '#ff4d2e', col]), drag: 3 }); }
  for (let i = 0; i < 20 * s; i++) { const a = rand(0, TAU), v = rand(200, 650); addPart({ kind: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.25, 0.65), max: 0.65, size: rand(1.5, 3), col: pick(['#fff3c4', '#ffd27a', col]), drag: 2.5 }); }
  for (let i = 0; i < 5 * s; i++) { const a = rand(0, TAU), v = rand(80, 320); addPart({ kind: 'debris', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.6, 1.2), max: 1.2, size: rand(3, 7), col, rot: rand(0, TAU), vr: rand(-12, 12), drag: 1.2 }); }
  for (let i = 0; i < 5 * s; i++) { const a = rand(0, TAU), v = rand(10, 60); addPart({ kind: 'smoke', x: x + rand(-8, 8) * s, y: y + rand(-8, 8) * s, vx: Math.cos(a) * v, vy: Math.sin(a) * v + 40, life: rand(0.8, 1.6), max: 1.6, size: rand(8, 18) * s, drag: 1 }); }
  rings.push({ x, y, r: 6, max: 80 * s, t: 0, life: 0.45, col: '#ffcf8a', w: 7 * s });
  if (s > 1.5) rings.push({ x, y, r: 4, max: 140 * s, t: 0, life: 0.7, col: col, w: 3 * s });
}
function sparkHit(x, y, col) {
  for (let i = 0; i < 4; i++) { const a = rand(Math.PI * 1.1, Math.PI * 1.9) + Math.PI; addPart({ kind: 'spark', x, y, vx: Math.cos(a) * rand(150, 380), vy: Math.sin(a) * rand(150, 380) * -1, life: 0.2, max: 0.2, size: 1.8, col, drag: 3 }); }
  addPart({ kind: 'glow', x, y, vx: 0, vy: 0, life: 0.08, max: 0.08, size: 18, col });
}
function popText(x, y, txt, col = '#fff', size = 18, life = 1) { texts.push({ x, y, txt, col, size, t: 0, life }); }
function addScore(n) { score += n; scoreBump = 1; }

// ================== 데미지 / 처치 ==================
function hits(e, x, y, rad) {
  if (e.type === 'boss') return Math.abs(x - e.x) < e.r * 1.8 + rad && y > e.y - e.r * 0.75 - rad && y < e.y + e.r * 0.95 + rad;
  const dx = x - e.x, dy = y - e.y, rr = e.r + rad; return dx * dx + dy * dy < rr * rr;
}
function damage(e, d) {
  if (e.dead) return;
  if (e.type === 'boss' && e.phase === 0) d *= 0.3;
  e.hp -= d; e.flash = 0.06;
  if (e.hp <= 0) { e.dead = true; kill(e); }
}
function kill(e) {
  combo++; comboT = 2.6; maxCombo = Math.max(maxCombo, combo);
  const mult = Math.min(5, 1 + Math.floor(combo / 10) * 0.5), pts = Math.round(e.score * mult);
  addScore(pts);
  if (combo % 10 === 0) { popText(W / 2, H * 0.4, combo + ' COMBO!', '#ffe14d', 42, 1.3); flash = Math.max(flash, 0.2); flashColor = '#ffe14d'; }
  if (e.type === 'boss') {
    bossDeath = { e, t: 0, nx: 0 }; boss = null; slowmo = 1.6; SFX.big();
    ebullets.forEach(b => sparkHit(b.x, b.y, b.col)); ebullets = [];
    popText(e.x, e.y - 30, '+' + pts, '#ffe14d', 34, 2);
    return;
  }
  popText(e.x, e.y, '+' + pts, mult > 1 ? '#ffe14d' : '#fff', mult > 1 ? 20 : 16);
  const s = { drone: 1, diver: 1.1, spinner: 1.4, tank: 2.3 }[e.type];
  explode(e.x, e.y, s, e.col); SFX.boom();
  shake = Math.min(40, shake + s * 4);
  if (s >= 2) { hitstop = 0.07; flash = Math.max(flash, 0.25); flashColor = '#ffb070'; }
  const chance = { drone: 0.05, diver: 0.09, spinner: 0.2, tank: 0.6 }[e.type];

    const lw = W * outCubic(clamp(t / 0.5, 0, 1));
    const g = ctx.createLinearGradient(W / 2 - lw / 2, 0, W / 2 + lw / 2, 0);
    g.addColorStop(0, 'rgba(95,232,255,0)'); g.addColorStop(0.5, 'rgba(95,232,255,0.9)'); g.addColorStop(1, 'rgba(95,232,255,0)');
    ctx.fillStyle = g; ctx.fillRect(W / 2 - lw / 2, cy - 42, lw, 2); ctx.fillRect(W / 2 - lw / 2, cy + 40, lw, 2);
  }
  ctx.translate(W / 2 + outK * W * 0.4, cy);
  const sc = (banner.boss ? 1 : lerp(2.4, 1, inK)) * (1 + outK * 0.3);
  ctx.scale(sc, sc * (banner.boss ? inK : 1));
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const fs = Math.min(64, W / 7);
  ctx.font = `900 ${fs}px ${FONT}`;
  // 색수차 효과
  ctx.globalCompositeOperation = 'lighter';
  const jit = (1 - clamp(t / 0.6, 0, 1)) * 10 + 1.5;
  ctx.fillStyle = 'rgba(255,0,80,0.7)'; ctx.fillText(banner.title, -jit, 0);
  ctx.fillStyle = 'rgba(0,200,255,0.7)'; ctx.fillText(banner.title, jit, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = banner.boss ? '#ffdddd' : '#fff'; ctx.fillText(banner.title, 0, 0);
  ctx.font = `700 ${Math.min(20, W / 20)}px ${KFONT}`; ctx.fillStyle = banner.boss ? '#ff8090' : '#9fefff';
  ctx.fillText(banner.sub, 0, fs * 0.7);
  ctx.restore(); ctx.globalAlpha = 1;
}
function drawTitle() {
  const t = titleT;
  // 비행기 호버링
  const px = W / 2 + Math.sin(t * 0.9) * 40, py = H * 0.68 + Math.sin(t * 1.7) * 12;
  for (const s of [-6, 6]) addPart({ kind: 'fire', x: px + s + rand(-1.5, 1.5), y: py + 28 * 1.6, vx: rand(-15, 15), vy: rand(250, 350), life: 0.3, max: 0.3, size: rand(9, 14), col: '#4fb6ff' });
  updateFx(1 / 60, 1 / 60);
  drawParts(1);
  drawJet(px, py, Math.cos(t * 0.9) * 0.5, 1.6);
  // 로고
  const title = 'SKY STRIKER', fs = Math.min(84, W / 7.5);
  ctx.font = `900 ${fs}px ${FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const tw = ctx.measureText(title).width;
  let x = W / 2 - tw / 2; const cy = H * 0.3;
  for (let i = 0; i < title.length; i++) {
    const ch = title[i], w = ctx.measureText(ch).width;
    const appear = clamp((t - i * 0.06) / 0.5, 0, 1), y = cy + Math.sin(t * 3 + i * 0.5) * 6 - (1 - outBack(appear)) * 80;
    ctx.globalAlpha = appear;
    const g = ctx.createLinearGradient(0, y - fs / 2, 0, y + fs / 2);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#7ff3ff'); g.addColorStop(1, '#3a6bff');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(80,140,255,0.4)'; ctx.fillText(ch, x - 3, y + 3); ctx.fillStyle = 'rgba(255,60,160,0.4)'; ctx.fillText(ch, x + 3, y - 2);
    ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = g; ctx.fillText(ch, x, y);
    x += w;
  }
  ctx.globalAlpha = 1;
  // 반짝임 스윕
  const sw = ((t * 0.5) % 1.6) - 0.3;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const sx = W / 2 - tw / 2 + sw * tw;
  const sg = ctx.createLinearGradient(sx - 40, 0, sx + 40, 0); sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,0.35)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sg; ctx.fillRect(sx - 40, cy - fs * 0.6, 80, fs * 1.2); ctx.restore();
  ctx.textAlign = 'center';
  ctx.font = `700 ${Math.min(20, W / 20)}px ${KFONT}`; ctx.fillStyle = 'rgba(180,230,255,0.85)';
  ctx.fillText('하늘을 가르는 최후의 전투기', W / 2, cy + fs * 0.75);
  const blink = 0.5 + 0.5 * Math.sin(t * 4);
  ctx.font = `900 ${Math.min(22, W / 18)}px ${FONT}`; ctx.fillStyle = `rgba(255,225,77,${0.4 + blink * 0.6})`;
  ctx.fillText('CLICK / TAP / SPACE', W / 2, H * 0.47);
  ctx.font = `600 13px ${KFONT}`; ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('마우스·터치·방향키로 이동 · 자동 사격 · SPACE / 우클릭으로 폭탄', W / 2, H * 0.92);
  if (best > 0) { ctx.font = `700 13px ${FONT}`; ctx.fillStyle = 'rgba(255,225,77,0.8)'; ctx.fillText('BEST ' + best, W / 2, H * 0.52); }
}
function drawOver() {
  const t = overT;
  ctx.fillStyle = `rgba(5,3,15,${Math.min(0.7, t * 0.8)})`; ctx.fillRect(0, 0, W, H);
  const txt = 'GAME OVER', fs = Math.min(72, W / 8);
  ctx.font = `900 ${fs}px ${FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const tw = ctx.measureText(txt).width; let x = W / 2 - tw / 2; const cy = H * 0.34;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i], w = ctx.measureText(ch).width, k = clamp((t - i * 0.07) / 0.6, 0, 1);
    const y = cy - (1 - outBack(k)) * 120;
    ctx.globalAlpha = k;
    ctx.fillStyle = '#ff2050'; ctx.fillText(ch, x + 3, y + 3);
    ctx.fillStyle = '#fff'; ctx.fillText(ch, x, y);
    x += w;
  }
  ctx.globalAlpha = clamp((t - 0.8) / 0.4, 0, 1);
  ctx.textAlign = 'center';
  const cnt = Math.round(score * outCubic(clamp((t - 0.8) / 1.2, 0, 1)));
  ctx.font = `900 ${Math.min(40, W / 12)}px ${FONT}`; ctx.fillStyle = '#ffe14d'; ctx.fillText(cnt, W / 2, cy + fs * 1.1);
  ctx.font = `700 14px ${FONT}`; ctx.fillStyle = 'rgba(200,230,255,0.8)';
  ctx.fillText(`WAVE ${wave}   ·   MAX COMBO ${maxCombo}   ·   BEST ${best}`, W / 2, cy + fs * 1.1 + 40);
  if (newRecord && t > 2) { const s = 1 + Math.sin(t * 8) * 0.08; ctx.save(); ctx.translate(W / 2, cy + fs * 1.1 + 76); ctx.scale(s, s); ctx.font = `900 22px ${FONT}`; ctx.fillStyle = '#ff7bf2'; ctx.fillText('NEW RECORD!', 0, 0); ctx.restore(); }
  if (t > 1.2) { ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 4); ctx.font = `700 16px ${KFONT}`; ctx.fillStyle = '#fff'; ctx.fillText('클릭 / 탭 / SPACE 로 다시 시작', W / 2, H * 0.72); }
  ctx.globalAlpha = 1;
}

// ================== 렌더 ==================
function render() {
  ctx.save();
  if (shake > 0.5) ctx.translate(rand(-1, 1) * shake, rand(-1, 1) * shake);
  drawBg();
  if (state === 'title') { drawTitle(); ctx.restore(); drawOverlay(); return; }
  drawParts(0);
  drawPickups();
  for (const e of enemies) if (e.type !== 'boss') drawEnemy(e);
  if (boss) drawBoss(boss, false);
  if (bossDeath) drawBoss(bossDeath.e, true);
  drawBullets();
  if (player.alive) {
    const blink = player.inv > 0 ? (Math.sin(T * 40) > 0 ? 0.35 : 1) : 1;
    drawJet(player.x, player.y, player.tilt, 1, blink);
    if (player.inv > 0 && state === 'play') { ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(120,240,255,${0.35 * Math.min(1, player.inv)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(player.x, player.y, 40 + Math.sin(T * 10) * 3, 0, TAU); ctx.stroke(); ctx.globalCompositeOperation = 'source-over'; }
    ctx.globalCompositeOperation = 'lighter'; drawGlow(player.x, player.y, 7, '#ff60a0', 0.9); ctx.globalCompositeOperation = 'source-over';
  }
  drawParts(1);
  drawEBullets();
  if (bombWave) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(150,255,255,0.08)'; ctx.beginPath(); ctx.arc(bombWave.x, bombWave.y, bombWave.r, 0, TAU); ctx.fill(); ctx.globalCompositeOperation = 'source-over'; }
  drawTexts();
  ctx.restore();
  if (state === 'play' || state === 'dying') drawHUD();
  drawBanner();
  if (state === 'over') drawOver();
  drawOverlay();
}
function drawOverlay() {
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  if (flash > 0) { ctx.globalAlpha = Math.min(1, flash) * 0.8; ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (player && player.alive && player.hp <= 2 && state === 'play') { // 저체력 붉은 테두리
    const a = 0.25 + 0.15 * Math.sin(T * 6);
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(255,0,40,0)'); g.addColorStop(1, `rgba(255,0,40,${a})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 48px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.font = `600 14px ${KFONT}`; ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillText('P 키 또는 클릭으로 계속', W / 2, H / 2 + 44);
  }
  if (muted) { ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.font = `700 11px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillText('MUTED', W - 18, H - 8); }
}

// ================== 루프 ==================
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) {
    T += rdt;
    if (hitstop > 0) { hitstop -= rdt; shake *= Math.exp(-7 * rdt); }
    else {
      slowmo = Math.max(0, slowmo - rdt);
      timeScale = lerp(timeScale, slowmo > 0 ? 0.3 : 1, 1 - Math.exp(-8 * rdt));
      update(rdt * timeScale, rdt);
    }
  }
  render();
  requestAnimationFrame(frame);
}
resize(); addEventListener('resize', resize);
resetGame();
requestAnimationFrame(frame);
</script>
